function calendarHTML(month) {
  const t = D.today(); const ms = D.som(month), me = D.eom(month);
  const gs = D.sow(ms), ge = D.add(D.sow(me), 6);
  const byDay = {};
  for (const o of allOccurrences(gs, ge)) {
    if (o.status === 'skipped' || o.kind === 'adjust') continue;
    const d = (byDay[o.date] = byDay[o.date] || { inc: 0, out: 0, n: 0 }); d.n++;
    if (o.kind === 'income') d.inc += o.amount; else if (o.kind === 'expense') d.out += o.amount;
  }
  for (const c of cardDues(gs, ge)) { const d = (byDay[c.date] = byDay[c.date] || { inc: 0, out: 0, n: 0 }); d.n++; d.card = true; }
  const ws = S.settings.format.weekStart;
  let h = `<div class="cal-nav"><button type="button" class="icon-btn" data-act="calNav" data-d="-1" aria-label="Mes anterior">${IC.left}</button><strong>${fmtDate(ms, 'month')}</strong><button type="button" class="icon-btn" data-act="calNav" data-d="1" aria-label="Mes siguiente">${IC.right}</button></div><div class="cal">`;
  for (let i = 0; i < 7; i++) h += `<div class="cal-wd">${DIA_L[(ws + i) % 7]}</div>`;
  for (let d = gs; d <= ge; d = D.add(d, 1)) {
    const x = byDay[d]; const cls = ['cal-d']; if (d < ms || d > me) cls.push('out'); if (d === t) cls.push('today'); if (HOL.has(d)) cls.push('hol');
    h += `<button type="button" class="${cls.join(' ')}" data-act="calDay" data-d="${d}" aria-label="${fmtDate(d, 'long')}${x ? ', ' + x.n + ' movimientos' : ''}"><span>${D.p(d).d}</span>`;
    if (x) { if (x.inc) h += `<span class="cal-amt in">+${cnum(x.inc)}</span>`; if (x.out) h += `<span class="cal-amt out">−${cnum(x.out)}</span>`; if (x.card && !x.out) h += `<span class="cal-amt" style="width:12px;height:12px">${IC.card}</span>`; }
    h += `</button>`;
  }
  return h + `</div><div class="muted small mt-s">Toca un día para ver sus movimientos. Los días subrayados son festivos.</div>`;
}

  if (arch.length) h += `<details class="more mt"><summary>Metas archivadas (${arch.length})</summary><div class="list">${arch.map((g) => `<button type="button" class="item dim" data-act="editGoal" data-id="${g.id}"><span class="ico" style="${tint(g.color)}" aria-hidden="true">${glyph(g.icon, 'target')}</span><span class="item-main"><span class="item-title">${esc(g.name)}</span></span><span class="amt">${money(goalSaved(g))}</span></button>`).join('')}</div></details>`;
  return h;
};
function goalCard(g) {
  const gi = goalInfo(g); const sv = S.settings.savings;
  let badge = '';
  if (gi.reached) badge = '<span class="badge ok">Lograda</span>';
  else if (gi.overdue) badge = '<span class="badge bad">Se pasó la fecha</span>';
  else if (gi.behind) badge = '<span class="badge warn">Atrasada</span>';
  else if (g.deadline) badge = '<span class="badge info">A tiempo</span>';
  const lines = [];
  if (!gi.reached) lines.push(`Faltan <b>${money(gi.remaining)}</b>`);
  if (gi.perPeriod != null) lines.push(`Ahorra <b>${money(gi.perPeriod)}</b> por ${gi.unit} (${gi.periods} ${gi.periods === 1 ? gi.unit : gi.unitPl} hasta el ${fmtDate(g.deadline, 'full')})${gi.unit === 'cobro' ? `, unos ${money(gi.perMonth)} al mes` : ''}`);
  if (gi.behind) lines.push(`<span class="warn-t">A esta fecha deberías llevar ${money(gi.expected)}</span>`);
  if (!gi.reached && !gi.overdue) {
    const eta = goalEta()[g.id];
    if (eta) lines.push(`<span class="${g.deadline && eta > g.deadline ? 'warn-t' : 'muted'}">Con tu regla de ahorro la alcanzas en ${fmtDate(eta, 'month')}${g.deadline && eta > g.deadline ? ', después de tu fecha límite' : ''}</span>`);
    else lines.push('<span class="muted">Con tu regla de ahorro actual no se alcanza en 10 años</span>');
  }
  if (gi.overdue) lines.push(`<span class="out">La fecha límite era el ${fmtDate(g.deadline, 'full')}</span>`);
  const meta = [`Prioridad ${g.priority || 3}`];
  if (sv.distribution === 'percent') meta.push(`${+g.percent || 0}% del ahorro`);
  if (+g.rate || accRate(g.accountId)) meta.push(`rinde ${+g.rate || accRate(g.accountId)}% anual`);
  if (findAcc(g.accountId)) meta.push(`en ${findAcc(g.accountId).name}`);
  const expPct = gi.expected != null && gi.target ? (gi.expected / gi.target) * 100 : null;
  return `<section class="panel">
    <button type="button" class="goal-head" data-act="goalHistory" data-id="${g.id}"><span class="ico" style="${tint(g.color, 18)}" aria-hidden="true">${glyph(g.icon, 'target')}</span><span class="item-main"><span class="item-title" style="font-size:1.0625rem">${esc(g.name)}</span><span class="item-sub">${esc(meta.join(', '))}</span></span>${badge}</button>
    <div class="goal-amt"><b>${money(gi.saved)}</b><span class="muted">de ${money(gi.target)}</span></div>
    ${progressBar(gi.pct, g.color || 'var(--primary)', 0, true, gi.behind ? expPct : null)}
    <div class="small mt-s" style="line-height:1.6">${lines.join('<br>')}</div>
    <div class="btn-row mt-s"><button type="button" class="btn sm" data-act="contribute" data-id="${g.id}" data-dir="1">Abonar</button><button type="button" class="btn sm ghost" data-act="contribute" data-id="${g.id}" data-dir="-1">Retirar</button><button type="button" class="btn sm ghost icon" data-act="editGoal" data-id="${g.id}" aria-label="Editar meta">${IC.edit}</button></div>
  </section>`;
}

/* ---------- PROYECCIÓN ---------- */

  h += ({ charts: projCharts, savings: projSavings, date: projDate, tips: projTips })[UI.pj]();
  return h;
};
function projSavings() {

  if (pr.horizonType === 'date') h += `<label class="field"><span>Fecha final</span><input class="input" type="date" data-set="projection.endDate" value="${esc(pr.endDate || D.addMonths(t, 36))}" min="${D.add(t, 7)}"></label>`;

  if (pr.showBalance) series.push({ name: 'Dinero disponible', color: 'var(--muted)', dashed: true, points: proj.points.map((p) => ({ date: p.date, y: p.balance })) });
  const markers = proj.goals.filter((g) => g.reached && g.reached > t).map((g) => ({ date: g.reached, y: nearestY(proj.points, g.reached), label: '', color: g.color || 'var(--primary)' }));

    <div class="legend">${series.map((s) => `<span><i class="${s.dashed ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i>${s.name}</span>`).join('')}${markers.length ? '<span>● Meta alcanzada</span>' : ''}</div>
    <div class="mt-s">
      <div class="kv"><span>Aportaciones futuras</span><span>${money(proj.contributions)}</span></div>
      <div class="kv"><span>Rendimientos</span><span class="in">${money(proj.interest)}</span></div>
      ${pr.showBalance ? `<div class="kv"><span>Dinero disponible al final</span><span class="${proj.finalBalance < 0 ? 'out' : ''}">${money(proj.finalBalance)}</span></div>` : ''}
    </div>
    ${proj.finalBalance < 0 && pr.showBalance ? `<div class="alert bad mt-s"><span class="a-ico">${IC.alert}</span><span class="a-body">Con tus gastos y tu regla de ahorro, tu dinero disponible se vuelve negativo.<small>Revisa tus gastos o baja el monto de ahorro.</small></span></div>` : ''}

      else if (g.reached) { txt = 'En ' + fmtDate(g.reached, 'month'); if (goal.deadline && g.reached > goal.deadline) { txt += ', después de tu fecha límite'; cls = 'warn-t'; } }

  h += panel('Supuestos', `
    ${switchHTML('Considerar inflación', { set: 'projection.inflationOn', checked: pr.inflationOn })}

    <div class="label">Ingresos variables</div>
    ${segHTML('vm', [['min', 'Mínimo'], ['avg', 'Promedio'], ['max', 'Máximo']], pr.variableMode, 'data-act="setVarMode" data-x')}

    <p class="muted small">El rendimiento anual (por ejemplo, CETES) se configura en cada cuenta de ahorro o en cada meta y se calcula con interés compuesto. ${S.settings.savings.distribution === 'manual' ? 'Con reparto manual, la proyección reparte el ahorro por prioridad.' : ''}</p>`);
  h += simulatorHTML(proj);
  return h;
};
/* ---------- Gráficas para tomar decisiones ---------- */
const ST_LABEL = { good: 'Bien', warn: 'Atención', bad: 'Riesgo' };
const ST_COLOR = { good: 'var(--st-good)', warn: 'var(--st-warn)', bad: 'var(--st-bad)' };
function insight(html, icon = 'bulb') { return `<div class="insight"><span aria-hidden="true">${IC[icon]}</span><span>${html}</span></div>`; }
function projCharts() {
  if (!S.rules.length && !S.accounts.length) return `<div class="panel">${emptyBox('chart', 'Agrega cuentas e ingresos para ver tus gráficas.', `<button type="button" class="btn" data-act="startWizard">Configurar mi app</button>`)}</div>`;

/** Saldo disponible proyectado día a día, con su punto más bajo */
function forecastPanel(days, id, compact = false) {
  const t = D.today(); const sim = simulateTo(D.add(t, days));
  const neg = sim.low.value < 0;
  const series = [{ name: 'Disponible', color: 'var(--c-1)', fill: true, points: sim.points.map((x) => ({ date: x.date, y: x.liquid })) }];
  const markers = sim.low.date > t ? [{ date: sim.low.date, y: sim.low.value, label: 'Mínimo', color: neg ? 'var(--st-bad)' : 'var(--c-1)', vline: false }] : [];
  let h = `<section class="panel"><div class="panel-h"><h2>${compact ? 'Saldo próximo' : 'Saldo disponible'}</h2><span class="sub">${days} días</span></div>`;
  h += `<p class="lead-q">${compact ? 'Efectivo y débito, con tus pagos programados.' : '¿Me alcanza hasta el próximo cobro? Efectivo y débito.'}</p>`;
  h += lineChart(id, series, { markers, height: compact ? 160 : 210, label: `Saldo disponible proyectado a ${days} días`, xFmt: 'short' });
  const lowTxt = `Tu punto más bajo: <b class="num">${esc(money(sim.low.value, { decimals: 0 }))}</b> el ${esc(fmtDate(sim.low.date, 'long'))}.`;
  if (neg) h += `<div class="alert bad mt-s"><span class="a-ico">${IC.alert}</span><span class="a-body">El ${esc(fmtDate(sim.firstNeg, 'long'))} tu saldo quedaría en negativo.<small>${lowTxt.replace(/<[^>]+>/g, '')} Mueve un gasto, transfiere de tu ahorro o baja el monto de ahorro.</small></span></div>`;
  else h += insight(lowTxt + (compact ? '' : ` Al final tendrías ${esc(money(sim.liquid1, { decimals: 0 }))}.`));
  if (!compact) {
    h += `<div class="muted small mt-s">Incluye tus movimientos programados, el ahorro de tu regla y el pago completo de tus tarjetas en su fecha límite.</div>`;
    const rows = sim.points.filter((_, i) => i % 7 === 0 || i === sim.points.length - 1).map((x) => [fmtDate(x.date, 'full'), money(x.liquid, { decimals: 0 })]);
    h += dataTable(['Fecha', 'Disponible'], rows);
  }
  return h + '</section>';
}
/** Ingresos contra gastos por mes (pasado real y meses proyectados) */
function monthsPanel() {
  const ms = monthlySeries(); if (!ms.some((x) => x.inc || x.exp)) return '';
  const series = [{ name: 'Ingresos', color: 'var(--c-3)' }, { name: 'Gastos', color: 'var(--c-2)' }];
  const rows = ms.map((x) => ({ label: MES_C[D.p(x.m).m - 1], title: fmtDate(x.m, 'month'), values: [x.inc, x.exp], faded: x.future, current: x.current,
    extra: `<div class="muted">Balance <b class="${x.net >= 0 ? 'in' : 'out'}">${esc(money(x.net, { sign: true, decimals: 0 }))}</b></div>` }));
  const fut = ms.filter((x) => x.future || x.current); const bad = fut.filter((x) => x.net < 0);
  const avg = fut.length ? sum(fut, (x) => x.net) / fut.length : 0;
  const worst = fut.slice().sort((a, b) => b.exp - a.exp)[0];
  let ins;
  if (bad.length) ins = `En ${esc(listJoin(bad.map((x) => fmtDate(x.m, 'month').split(' ')[0])))} gastarías más de lo que ganas. Revisa esos meses antes de comprometer otro gasto.`;
  else ins = `Los próximos meses cierran a favor: unos <b class="num">${esc(money(avg, { decimals: 0 }))}</b> al mes en promedio.${worst ? ` El mes más pesado es ${esc(fmtDate(worst.m, 'month').split(' ')[0])} (${esc(money(worst.exp, { decimals: 0 }))} de gastos).` : ''}`;
  return `<section class="panel"><div class="panel-h"><h2>Ingresos y gastos</h2><span class="sub">por mes</span></div>
    <p class="lead-q">¿Qué meses vienen apretados?</p>
    ${columnChart('ch-months', rows, series, { label: 'Ingresos y gastos por mes' })}
    <div class="legend">${series.map((s) => `<span><i class="box" style="background:${s.color}"></i>${s.name}</span>`).join('')}<span><i class="box faded" style="background:var(--c-rest)"></i>Más claro: proyectado</span></div>
    ${insight(ins, bad.length ? 'alert' : 'bulb')}
    ${dataTable(['Mes', 'Ingresos', 'Gastos', 'Balance'], ms.map((x) => [fmtDate(x.m, 'month') + (x.future ? ' (proy.)' : ''), money(x.inc, { decimals: 0 }), money(x.exp, { decimals: 0 }), money(x.net, { sign: true, decimals: 0 })]))}
  </section>`;
}
/** Reparto del ingreso del periodo: fijos, variables, ahorro y lo que queda libre */
function splitPanel(p) {
  const s = incomeSplit(p); if (s.inc <= 0) return '';
  const parts = [['Gastos fijos', s.fixed, 'var(--c-1)'], ['Gastos variables', s.variable, 'var(--c-2)'], ['Ahorro', s.save, 'var(--c-3)']];
  if (s.free > 0) parts.push(['Libre', s.free, 'var(--c-rest)']);
  const total = Math.max(s.inc, s.fixed + s.variable + s.save);
  const pct = (v) => Math.round((v / s.inc) * 100);
  const needs = pct(s.fixed), want = pct(s.variable), save = pct(s.save);
  let ins = `Tu reparto: ${needs}% fijos, ${want}% variables y ${save}% ahorro. Una guía común es 50% necesidades, 30% gustos y 20% ahorro.`;
  if (s.free < 0) ins = `Este periodo te faltan <b class="num">${esc(money(-s.free, { decimals: 0 }))}</b> para cubrir gastos y ahorro. Baja gastos variables o ajusta tu ahorro.`;
  return `<section class="panel"><div class="panel-h"><h2>¿A dónde va tu ingreso?</h2><span class="sub">${esc(periodLabel(p))}</span></div>
    <div class="kv" style="padding-top:0"><span>Ingreso del periodo</span><span>${esc(money(s.inc, { decimals: 0 }))}</span></div>
    <div class="split" role="img" aria-label="${esc(parts.map(([n, v]) => `${n} ${pct(v)}%`).join(', '))}">${parts.filter(([, v]) => v > 0).map(([n, v, c]) => `<span style="--c:${c};width:${(v / total) * 100}%" title="${esc(n)}"></span>`).join('')}</div>
    <div class="legend-rows">${parts.map(([n, v, c]) => `<div><i style="--c:${c}" aria-hidden="true"></i><span>${esc(n)}</span><b>${pct(v)}%</b></div>`).join('')}</div>
    ${insight(ins, s.free < 0 ? 'alert' : 'bulb')}
    ${dataTable(['Concepto', 'Monto', '% del ingreso'], parts.map(([n, v]) => [n, money(v, { decimals: 0 }), pct(v) + '%']))}
  </section>`;
}
/** Gasto por categoría contra presupuesto y contra tu promedio */
function categoriesPanel(p) {
  const rows = categoryCompare(p).slice(0, 8); if (!rows.length) return '';
  const mx = Math.max(1, ...rows.map((r) => Math.max(r.spent + r.sched, r.budget)));
  let up = null;
  const body = rows.map((r) => {
    const over = r.budget > 0 && r.spent > r.budget;
    const d = r.avg ? Math.round(((r.spent + r.sched - r.avg) / r.avg) * 100) : null;
    if (d != null && d > 10 && (!up || d > up.d)) up = { name: r.cat.name, d };
    const parts = [`${money(r.spent, { decimals: 0 })}${r.budget ? ' de ' + money(r.budget, { decimals: 0 }) : ''}`];
    if (r.sched) parts.push(`+${money(r.sched, { decimals: 0 })} programado`);
    if (d != null && Math.abs(d) >= 5) parts.push(`${d > 0 ? '+' : ''}${d}% vs. promedio`);
    if (over) parts.push('excedido');
    return `<span class="hbar-l">${catInline(r.cat.id)} ${esc(r.cat.name)}</span>
      <span class="hbar-t" aria-hidden="true"><i class="${over ? 'over' : ''}" style="width:${(r.spent / mx) * 100}%${over ? ';background:var(--st-bad)' : ''}"></i>${r.sched ? `<i class="ghost" style="left:${(r.spent / mx) * 100}%;width:${(r.sched / mx) * 100}%;border-radius:0 4px 4px 0"></i>` : ''}${r.budget ? `<span class="tick" style="left:${(r.budget / mx) * 100}%"></span>` : ''}</span>
      <span class="hbar-v">${esc(parts.join(', '))}</span>`;
  }).join('');
  const overN = rows.filter((r) => r.budget > 0 && r.spent > r.budget);
  let ins = up ? `Tu mayor aumento es ${esc(up.name)}: ${up.d}% más que tu promedio de periodos anteriores.` : 'Ninguna categoría está muy por encima de tu promedio.';
  if (overN.length) ins = `Ya te pasaste del presupuesto en ${esc(listJoin(overN.map((r) => r.cat.name)))}. ` + ins;
  return `<section class="panel"><div class="panel-h"><h2>Gasto por categoría</h2><span class="sub">${esc(periodLabel(p))}</span></div>
    <p class="lead-q">¿Dónde puedo recortar?</p>
    <div class="hbar">${body}</div>
    <div class="legend mt-s"><span><i class="box" style="background:var(--c-1)"></i>Gastado</span><span><i class="box faded" style="background:var(--c-1)"></i>Programado</span><span><i style="background:var(--ink);width:2px;height:12px"></i>Presupuesto</span><span><i class="box" style="background:var(--st-bad)"></i>Excedido</span></div>
    ${insight(ins, overN.length ? 'alert' : 'bulb')}
    ${dataTable(['Categoría', 'Gastado', 'Programado', 'Presupuesto', 'Promedio'], rows.map((r) => [r.cat.name, money(r.spent, { decimals: 0 }), money(r.sched, { decimals: 0 }), r.budget ? money(r.budget, { decimals: 0 }) : '—', r.avg != null ? money(r.avg, { decimals: 0 }) : '—']))}
  </section>`;
}

/* ---------- Simulador: ¿cuánto tendré en tal fecha? ---------- */
function sdPresets() {
  const t = D.today(); const y = D.p(t).y; const eom = D.eom(t) === t ? D.eom(D.add(t, 1)) : D.eom(t);

}
function delta(v) { return `<span class="small ${v > 0.5 ? 'in' : v < -0.5 ? 'out' : 'muted'} num">${v > 0.5 ? '+' : ''}${esc(money(v, { decimals: 0 }))}</span>`; }
function projDate() {

  const days = D.diff(t, sd.date);
  let h = `<section class="panel"><div class="panel-h"><h2>¿Cuánto tendré el…?</h2></div>

    <div class="chips">${sdPresets().map(([l, d]) => `<button type="button" class="chip sm" data-act="sdPreset" data-d="${d}" aria-pressed="${sd.date === d}">${l}</button>`).join('')}</div></section>`;
  h += `<section class="panel"><div class="muted small">${esc(fmtDate(sd.date, 'long').replace(/^./, (c) => c.toUpperCase()))}, en ${daysText(days)}</div>
    <div class="row between wrap" style="align-items:baseline;margin:.25rem 0 .75rem"><span><span class="muted small" style="display:block">Patrimonio estimado</span><span class="amt big">${esc(money(r.net1, { decimals: 0 }))}</span></span>${delta(r.net1 - r.net0)}</div>
    <div class="duo">
      <div class="stat"><small>Disponible</small><b>${esc(money(r.liquid1, { decimals: 0 }))}</b>${delta(r.liquid1 - r.liquid0)}</div>
      <div class="stat"><small>Ahorro y metas</small><b>${esc(money(r.saved1, { decimals: 0 }))}</b>${delta(r.saved1 - r.saved0)}</div>

    <div class="seg" role="group" aria-label="Tipo">${[['expense', 'Gasto'], ['income', 'Ingreso']].map(([v, l]) => `<button type="button" data-act="sdKind" data-v="${v}" aria-pressed="${(UI.sdKind || 'expense') === v}">${l}</button>`).join('')}</div>
    <div class="grid2"><label class="field"><span>Monto</span><input class="input num-in" id="sd-x-amt" inputmode="decimal" placeholder="0"></label><label class="field"><span>Fecha</span><input class="input" type="date" id="sd-x-date" value="${D.add(t, 15) < sd.date ? D.add(t, 15) : sd.date}" min="${t}" max="${sd.date}"></label></div>

}

/* ---------- Desglose: ¿por qué tendrás ese disponible? ---------- */
const LEDGER = {
  inc: { label: 'Ingresos', icon: 'briefcase' },
  exp: { label: 'Gastos con efectivo y débito', icon: 'cart' },
  card: { label: 'Pagos de tarjetas', icon: 'card' },
  debt: { label: 'Pagos de otras deudas', icon: 'receipt' },
  save: { label: 'Ahorro para tus metas', icon: 'piggy' },
  trf: { label: 'Transferencias entre cuentas', icon: 'swap' },
};
const ledgerName = (x) => x.name + (x.of ? ` (${x.part} de ${x.of})` : '');
const ledgerIcon = (x) => ((x.cls === 'inc' || x.cls === 'exp') && x.cat && findCat(x.cat) ? catIcon(x.cat) : ico(LEDGER[x.cls].icon));
function breakdownPanel(r) {
  const by = {}, cnt = {};
  for (const x of r.ledger) { by[x.cls] = (by[x.cls] || 0) + x.amt; cnt[x.cls] = (cnt[x.cls] || 0) + 1; }
  const rows = Object.keys(LEDGER).filter((c) => Math.abs(by[c] || 0) > 0.5).map((c) => ({ c, amt: round2(by[c]), n: cnt[c] }));
  const mx = Math.max(1, Math.abs(r.liquid0), Math.abs(r.liquid1), ...rows.map((x) => Math.abs(x.amt)), r.liqInterest);
  const m0 = (v, sign) => money(v, { decimals: 0, sign });
  const bar = (v, cls) => `<span class="wf-bar" aria-hidden="true"><i class="${cls}" style="width:${Math.max(1.5, (Math.abs(v) / mx) * 100)}%"></i></span>`;
  let h = `<section class="panel"><div class="panel-h"><h2>¿Por qué tendrás eso?</h2><span class="sub">al ${esc(fmtDate(r.end))}</span></div>
    <p class="lead-q" style="margin-top:0">Todo lo que entra y sale de tu efectivo y débito de hoy a esa fecha. Toca una línea para ver cada movimiento.</p>
    <div class="wf">
      <div class="wf-row total"><span class="wf-l"><span><b>Disponible hoy</b></span></span><span class="wf-v">${esc(m0(r.liquid0))}</span>${bar(r.liquid0, 'base')}</div>
      ${rows.map((x) => `<button type="button" class="wf-row" data-act="sdLedger" data-c="${x.c}"><span class="wf-l"><span class="wf-ico" aria-hidden="true">${ico(LEDGER[x.c].icon)}</span><span><b>${esc(LEDGER[x.c].label)}</b><small>${x.n === 1 ? '1 movimiento' : x.n + ' movimientos'}</small></span></span><span class="wf-v ${x.amt > 0 ? 'in' : ''}">${esc(m0(x.amt, true))}</span>${bar(x.amt, x.amt > 0 ? 'up' : 'down')}</button>`).join('')}
      ${r.liqInterest > 0.5 ? `<div class="wf-row"><span class="wf-l"><span class="wf-ico" aria-hidden="true">${IC.trendUp}</span><span><b>Rendimientos</b><small>De tus cuentas con rendimiento</small></span></span><span class="wf-v in">${esc(m0(r.liqInterest, true))}</span>${bar(r.liqInterest, 'up')}</div>` : ''}
      <div class="wf-row total end"><span class="wf-l"><span><b>Disponible el ${esc(fmtDate(r.end, 'day'))}</b></span></span><span class="wf-v ${r.liquid1 < 0 ? 'out' : ''}">${esc(m0(r.liquid1))}</span>${bar(r.liquid1, r.liquid1 < 0 ? 'down' : 'base')}</div>
    </div>`;
  const notes = [];
  if (r.offCard > 0.5) notes.push(`${esc(m0(r.offCard))} en compras con tarjeta: salen de tu disponible hasta que pagas la tarjeta`);
  if (r.offVouchers > 0.5) notes.push(`${esc(m0(r.offVouchers))} en gastos con vales de despensa: se descuentan de tus vales`);
  if (notes.length) h += insight(`No te descuentan directo: ${notes.join('; ')}.`, 'info');
  // lo que más te descuenta, agrupado por nombre
  const g = {};
  for (const x of r.ledger) {
    if (x.amt >= 0) continue; const k = x.cls + '|' + x.name;
    const o = (g[k] = g[k] || { x, total: 0, n: 0 }); o.total += -x.amt; o.n++;
  }
  const top = Object.values(g).sort((a, b) => b.total - a.total).slice(0, 6); const outTot = sum(Object.values(g), (o) => o.total);
  if (top.length) {
    h += `<div class="label mt">Lo que más te descuenta</div><div class="list">${top.map((o) => `<div class="item" style="min-height:52px"><span class="ico sm" style="${o.x.cat && findCat(o.x.cat) ? tint(catColor(o.x.cat)) : ''}" aria-hidden="true">${ledgerIcon(o.x)}</span><span class="item-main"><span class="item-title">${esc(o.x.name)}</span><span class="item-sub">${o.n === 1 ? '1 vez' : o.n + ' veces'}, ${Math.round((o.total / Math.max(1, outTot)) * 100)}% de lo que sale</span></span><span class="amt">−${esc(m0(o.total))}</span></div>`).join('')}</div>`;
  }
  h += `<button type="button" class="btn outline block mt" data-act="sdLedger" data-c="all">${IC.list} Ver cada movimiento (${r.ledger.length})</button></section>`;
  return h;
}
/** Hoja con cada movimiento que cambia tu disponible, agrupado por día */
function openLedgerSheet(filter = 'all') {
  let f = filter;
  const sh = openSheet({ title: 'Movimiento por movimiento', tall: true });
  sh.setFoot('');
  const draw = () => {
    const r = simulateTo(UI.sd.date, simBase());
    const present = Object.keys(LEDGER).filter((c) => r.ledger.some((x) => x.cls === c));
    const list = f === 'all' ? r.ledger : r.ledger.filter((x) => x.cls === f);
    const tot = sum(list, (x) => x.amt);
    let h = `<div class="chips scroll mb" role="group" aria-label="Filtrar">${[['all', 'Todo'], ...present.map((c) => [c, LEDGER[c].label.split(' ')[0] === 'Gastos' ? 'Gastos' : LEDGER[c].label.replace('Pagos de ', '').replace('Ahorro para tus metas', 'Ahorro').replace('Transferencias entre cuentas', 'Transferencias')])].map(([v, l]) => `<button type="button" class="chip sm" data-f="${v}" aria-pressed="${f === v}">${esc(l.charAt(0).toUpperCase() + l.slice(1))}</button>`).join('')}</div>`;
    h += f === 'all' ? `<div class="kv" style="padding-top:0"><span>Empiezas con</span><span>${esc(money(r.liquid0, { decimals: 0 }))}</span></div><div class="kv"><span>Terminas el ${esc(fmtDate(r.end, 'day'))} con</span><span class="strong">${esc(money(r.liquid1, { decimals: 0 }))}</span></div>`
      : `<div class="kv" style="padding-top:0"><span>${list.length === 1 ? '1 movimiento' : list.length + ' movimientos'}</span><span class="${tot > 0 ? 'in' : ''}">${esc(money(tot, { decimals: 0, sign: true }))}</span></div>`;
    if (!list.length) h += `<div class="empty"><p>No hay movimientos de este tipo.</p></div>`;
    const MAX = 500; let cur = null, buf = '', dayTot = 0, dayBal = 0;
    const flush = () => { if (cur) h += `<div class="day-h"><span>${esc(relDay(cur))}</span><span>${f === 'all' ? 'Queda ' + esc(money(dayBal, { decimals: 0 })) : esc(money(dayTot, { decimals: 0, sign: true }))}</span></div><div class="list">${buf}</div>`; };
    for (const x of list.slice(0, MAX)) {
      if (x.d !== cur) { flush(); cur = x.d; buf = ''; dayTot = 0; }
      dayTot += x.amt; dayBal = x.bal;
      const sub = [accName(x.acc)]; if (x.extra) sub.push('simulado'); if (x.goals && x.goals.length) sub.push(listJoin(x.goals));
      buf += `<div class="item" style="min-height:52px"><span class="ico sm" style="${x.cat && findCat(x.cat) ? tint(catColor(x.cat)) : ''}" aria-hidden="true">${ledgerIcon(x)}</span><span class="item-main"><span class="item-title">${esc(ledgerName(x))}</span><span class="item-sub">${esc(sub.join(', '))}</span></span><span class="amt ${x.amt > 0 ? 'in' : ''}">${esc(money(x.amt, { sign: true }))}</span></div>`;
    }
    flush();
    if (list.length > MAX) h += `<p class="muted small mt">Se muestran los primeros ${MAX}. Elige una fecha más cercana para ver el resto.</p>`;
    if (f === 'all' && r.liqInterest > 0.5) h += `<p class="muted small mt">Además, tus cuentas generan ${esc(money(r.liqInterest))} de rendimientos en ese lapso.</p>`;
    sh.setBody(h);
  };
  draw();
  sh.body.addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { f = b.dataset.f; draw(); sh.body.scrollTop = 0; } });
}

/* ---------- Deudas en el simulador ---------- */
/** Opciones del simulador guardadas: regla de ahorro, extras, deudas y forma de pago de cada tarjeta */
function simBase() {
  const t = D.today();
  return { applySavings: UI.sd.savings, extras: S.sim.extras.filter((x) => x.date >= t), debts: activeSimDebts(), cardPlan: S.sim.cardPlan, split: S.sim.split };
}
const cardPlanOf = (id) => S.sim.cardPlan[id] || 'due';
function planChips(act, id, cur, withNone) {
  return `<div class="chips plan-chips" role="group" aria-label="¿Cuándo pagas?">${Object.entries(CONFIG.debtPlans).filter(([k]) => withNone || k !== 'none')
    .map(([k, p]) => `<button type="button" class="chip sm" data-act="${act}" data-id="${id}" data-v="${k}" aria-pressed="${cur === k}">${esc(p.chip)}</button>`).join('')}</div>`;
}
/** Texto y montos de cómo queda el pago de una deuda (o de un corte de tarjeta).
 *  key identifica sus montos elegidos por cobro en S.sim.split; from = desde cuándo se puede pagar. */
function planLine(plan, pays, due, amount, paydays, key, from = D.today()) {
  const t = D.today();
  if (plan === 'none') return `<p class="plan-note">No se paga en la simulación: la deuda sigue y en una tarjeta genera intereses.</p>`;
  if (!(amount > 0.004)) return `<p class="plan-note">No hay saldo por pagar.</p>`;
  if (!pays.length) return `<p class="plan-note">Sin pagos dentro de la simulación.</p>`;
  const inWin = paydays.filter((d) => d >= from && d <= due).length;
  const custom = plan === 'split' && S.sim.split[key] && Object.keys(S.sim.split[key]).length;
  let lead;
  if (due < t) lead = 'Ya venció: se paga en cuanto se pueda.';
  else if (plan === 'split') lead = pays.length > 1 ? (custom ? `En ${pays.length} pagos, con los montos que elegiste:` : `En ${pays.length} pagos iguales, uno por cobro:`) : inWin ? 'Antes de la fecha límite solo cae un cobro:' : 'No cobras antes de la fecha límite; se paga ese día:';
  else if (plan === 'asap') lead = pays[0].d === due && !paydays.includes(due) ? 'No cobras antes de la fecha límite; se paga ese día:' : 'Todo con tu próximo cobro:';
  else lead = 'Todo el último día:';
  const edit = plan === 'split' && inWin >= 2 && due >= t
    ? `<button type="button" class="btn sm ghost plan-edit" data-act="sdSplitEdit" data-k="${esc(key)}">${IC.edit} ${custom ? 'Cambiar los montos' : 'Elegir cuánto pagar en cada cobro'}</button>` : '';
  return `<p class="plan-note">${esc(lead)}</p><div class="pay-pills">${pays.map((p) => `<span class="pay-pill"><span>${esc(fmtDate(p.d))}</span><b>${esc(money(p.amt, { decimals: p.amt % 1 ? 2 : 0 }))}</b></span>`).join('')}</div>${edit}`;
}
function debtsPanel(base) {
  const t = D.today(); const cards = activeAccounts().filter((a) => a.type === 'credit'); const all = S.sim.debts;
  // hasta dónde simular para ver todos los pagos: la fecha límite más lejana
  let end = D.add(t, 1); let any = false;
  for (const x of base.debts) { end = D.max(end, x.due); any = true; }
  const cinfo = {};
  for (const a of cards) {
    const c = cardInfo(a); cinfo[a.id] = c;
    if (cardPlanOf(a.id) !== 'none' && (c.pendingLast > 0 || c.nextStatement > 0 || c.debt > 0)) { end = D.max(end, c.dueNext); any = true; }
  }
  end = D.min(end, D.add(t, 400));
  const cur = simulateTo(end, base);
  let h = `<section class="panel" id="sd-debts"><div class="panel-h"><h2>Deudas y cómo pagarlas</h2></div>
    <p class="lead-q" style="margin-top:0">Elige si pagas cada deuda completa con tu próximo cobro, dividida entre los cobros que caen antes de su fecha límite o toda el último día.</p>`;
  for (const a of cards) {
    const c = cinfo[a.id]; const plan = cardPlanOf(a.id);
    const groups = [];
    if (c.pendingLast > 0) groups.push({ title: `Corte del ${fmtDate(c.lastCut)}`, amount: c.pendingLast, due: c.dueLast, est: false });
    groups.push({ title: `Próximo corte, ${fmtDate(c.nextCut)}${c.nextStatement > 0 ? ' (aprox.)' : ''}`, amount: c.nextStatement, due: c.dueNext, est: true });
    h += `<div class="debt-item"><div class="debt-head"><span class="ico sm" aria-hidden="true">${IC.card}</span><span class="item-main"><span class="item-title">${esc(a.name)}</span><span class="item-sub">Tarjeta de crédito, debes ${esc(money(c.debt, { decimals: 0 }))}</span></span></div>
      ${planChips('sdCardPlan', a.id, plan, true)}
      ${groups.map((g) => `<div class="debt-cycle"><div class="kv"><span>${esc(g.title)}</span><span>${esc(money(g.amount, { decimals: 0 }))}</span></div><div class="muted tiny">Fecha límite: ${esc(g.due < t ? 'venció el ' + fmtDate(g.due, 'long') : fmtDate(g.due, 'long'))}</div>
        ${planLine(plan, cur.pays.filter((p) => p.ref === a.id && p.due === g.due), g.due, g.amount, cur.paydays, `card:${a.id}:${g.due}`, g.est ? c.nextCut : t)}</div>`).join('')}
    </div>`;
  }
  for (const x of all) {
    const gone = !(D.valid(x.due) && x.due >= t);
    h += `<div class="debt-item ${gone ? 'dim' : ''}"><div class="debt-head"><span class="ico sm" aria-hidden="true">${ico('receipt')}</span><button type="button" class="item-main debt-edit" data-act="sdEditDebt" data-id="${x.id}"><span class="item-title">${esc(x.name)}</span><span class="item-sub">${esc(money(x.amount, { decimals: 0 }))}, ${gone ? 'venció el ' : 'límite '}${esc(fmtDate(x.due, 'day'))}${x.accountId && findAcc(x.accountId) ? ', de ' + esc(findAcc(x.accountId).name) : ''}</span></button><button type="button" class="icon-btn" data-act="sdDelDebt" data-id="${x.id}" aria-label="Quitar ${esc(x.name)}">${IC.close}</button></div>
      ${gone ? '<p class="plan-note">Su fecha límite ya pasó; no entra en la simulación.</p>' : planChips('sdDebtPlan', x.id, x.plan || 'split', false) + planLine(x.plan || 'split', cur.pays.filter((p) => p.ref === x.id), x.due, +x.amount, cur.paydays, 'debt:' + x.id)}
    </div>`;
  }
  if (!cards.length && !all.length) h += `<p class="muted small">Aún no tienes tarjetas ni deudas en la simulación.</p>`;
  h += `<button type="button" class="btn ghost block mt-s" data-act="sdNewDebt">${IC.plus} Agregar una deuda</button>
    <p class="muted small mt-s">Por ejemplo, un préstamo o un pago con fecha límite. Las deudas que agregues aquí solo se usan en el simulador; no cambian tus movimientos ni tus saldos.</p></section>`;
  if (any) h += debtCompareHTML(end, base);
  return h;
}
/** ¿Conviene dividir? Compara las tres formas de pago con todas las deudas a la vez */
function debtCompareHTML(end, base) {
  const t = D.today(); const cmp = debtCompare(end, base); const [A, Sp, Du] = cmp;
  if (!A.r.pays.length && !Sp.r.pays.length && !Du.r.pays.length) return '';
  const P = CONFIG.debtPlans; const m0 = (v) => money(v, { decimals: 0 });
  const series = [
    { name: P.asap.label, color: 'var(--c-2)', dashed: true, points: A.r.points.map((x) => ({ date: x.date, y: x.liquid })) },
    { name: P.split.label, color: 'var(--c-1)', points: Sp.r.points.map((x) => ({ date: x.date, y: x.liquid })) },
  ];
  // el cobro donde más cambia lo que te queda
  let best = null;
  Sp.atPay.forEach((x, i) => { const a = A.atPay[i]; if (x.liquid == null || !a || a.liquid == null) return; const d = x.liquid - a.liquid; if (!best || d > best.d) best = { d, date: x.d, sp: x.liquid, as: a.liquid }; });
  const same = Math.abs(Sp.low.value - A.low.value) < 1 && (!best || best.d < 1);
  let txt;

    <div class="table-wrap mt-s"><table class="data cmp"><caption class="sr">Disponible al cierre de cada día de cobro</caption><thead><tr><th scope="col">Tras el cobro</th>${cmp.map((c) => `<th scope="col">${esc(P[c.plan].col)}</th>`).join('')}</tr></thead>

  </section>`;
}

const KIND_LABEL = { income: 'Ingreso', expense: 'Gasto', transfer: 'Transferencia', adjust: 'Ajuste de saldo' };
function defaultAccountId(kind) {

  const acc = activeAccounts(); const pref = acc.find((a) => a.type === (kind === 'income' ? 'debit' : 'debit')) || acc.find((a) => a.type !== 'savings') || acc[0];

function firstCatId(kind) { const c = S.categories.find((x) => x.kind === kind && !x.parentId); return c ? c.id : null; }

/** Con vales de despensa, cada gasto pregunta con qué se pagó (no se elige uno por defecto) */

/* ---------- Movimiento: crear y editar ----------
 * scope: 'new' | 'dup' | 'all' (toda la regla) | 'future' (esta y siguientes) | 'one' (solo esta vez) */
function openMoveForm({ rule = null, scope = 'new', occ = null, kind = 'expense', recurring = false, date = null, lockKind = false, preset = null, onSaved = null } = {}) {
  const src = preset || rule || {};
  const d = {
    kind: src.kind || kind, name: src.name || '', amount: src.amount != null ? src.amount : null, variable: !!src.variable,
    min: src.min != null ? src.min : null, max: src.max != null ? src.max : null,
    accountId: src.accountId || (askPayment(src.kind || kind) ? null : defaultAccountId(src.kind || kind)), toAccountId: src.toAccountId || null,
    categoryId: src.categoryId !== undefined ? src.categoryId : null, notes: src.notes || '',
    remindDays: src.remindDays != null ? src.remindDays : '',
    freq: src.freq ? normFreq(clone(src.freq)) : normFreq({ type: recurring ? 'monthly' : 'once', start: date || D.today() }),
  };
  if (d.kind === 'transfer' && !d.toAccountId) { const o = activeAccounts().find((a) => a.id !== d.accountId); d.toAccountId = o ? o.id : null; }
  if (scope === 'one' && occ) Object.assign(d, { name: occ.name, amount: occ.amount, accountId: occ.accountId, categoryId: occ.categoryId, notes: occ.notes, date: occ.date });
  if (scope === 'future' && occ) { d.freq.start = occ.key; if (d.freq.endType === 'count') d.freq.count = Math.max(1, d.freq.count - (occ.n - 1)); }
  const titles = { new: 'Nuevo movimiento', dup: 'Duplicar movimiento', all: 'Editar movimiento', future: 'Editar esta y las siguientes', one: 'Editar solo esta vez' };
  let fe = null;
  const sh = openSheet({ title: titles[scope], tall: true, foot: `<button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" data-save>Guardar</button>` });

  function sync() {
    const v = readFields(sh.body);
    if ('amount' in v) d.amount = parseAmount(v.amount);
    if ('min' in v) d.min = parseAmount(v.min);
    if ('max' in v) d.max = parseAmount(v.max);
    if ('name' in v) d.name = v.name.trim();
    if ('accountId' in v) d.accountId = v.accountId || null;
    if ('toAccountId' in v) d.toAccountId = v.toAccountId || null;
    if ('notes' in v) d.notes = v.notes;
    if ('remindDays' in v) d.remindDays = v.remindDays === '' ? '' : Math.max(0, parseInt(v.remindDays, 10) || 0);
    if ('date' in v) d.date = v.date;
    if (fe) d.freq = fe.get();
  }
  function draw() {
    const k = d.kind; const isT = k === 'transfer'; const one = scope === 'one';
    let h = '';
    if (!one && !lockKind && (scope === 'new' || scope === 'dup')) h += segHTML('kind', [['expense', 'Gasto'], ['income', 'Ingreso'], ['transfer', 'Transferencia']], k);
    if (k === 'income' && d.variable && !one) {
      h += `<div class="grid2"><label class="field"><span>Mínimo estimado</span>${moneyInput('min', d.min)}</label><label class="field"><span>Máximo estimado</span>${moneyInput('max', d.max)}</label></div>`;
    } else {
      h += `<div class="field"><span>${d.variable && !one ? 'Monto estimado' : one && d.variable ? 'Monto real' : 'Monto'}</span>${moneyInput('amount', d.amount, { big: true })}</div>`;
    }
    h += `<label class="field"><span>Nombre</span><input class="input" name="name" value="${esc(d.name)}" placeholder="${isT ? 'Ej. Pago de tarjeta' : k === 'income' ? 'Ej. Sueldo' : 'Ej. Renta, súper, Netflix…'}" autocomplete="off"></label>`;
    if (!isT && !one) {
      if (k === 'expense') h += `<div class="field"><span>Tipo de gasto</span>${segHTML('var', [['0', 'Fijo'], ['1', 'Variable']], d.variable ? '1' : '0')}</div>`;
      else h += switchHTML('Ingreso variable', { name: 'variableInc', checked: d.variable, sub: 'Cambia cada vez; indica un mínimo y un máximo' });
    }
    if (isT) h += `<div class="grid2"><label class="field"><span>Desde</span><select class="input" name="accountId">${accountOptions(d.accountId)}</select></label><label class="field"><span>Hacia</span><select class="input" name="toAccountId">${accountOptions(d.toAccountId)}</select></label></div>`;
    else h += `<label class="field"><span>${k === 'expense' ? '¿Con qué pagaste?' : k === 'income' ? '¿A dónde llega?' : 'Cuenta'}</span><select class="input" name="accountId">${accountOptions(d.accountId, { none: !activeAccounts().length || !d.accountId, noneLabel: activeAccounts().length ? (k === 'expense' ? 'Elige con qué pagaste' : 'Elige una cuenta') : 'Sin cuenta' })}</select></label>`;
    if (!isT) h += `<div class="field"><span>Categoría</span><div data-catbox>${catChips(k, d.categoryId)}</div></div>`;
    if (one) h += `<label class="field"><span>Fecha de esta vez</span><input class="input" type="date" name="date" value="${esc(d.date)}"></label>`;
    else h += `<div data-freq></div>`;
    h += `<details class="more" ${d.notes || d.remindDays !== '' ? 'open' : ''}><summary>Más opciones</summary>
      ${k === 'expense' && !one ? `<label class="field"><span>Recordarme días antes</span><input class="input" name="remindDays" inputmode="numeric" value="${esc(d.remindDays)}" placeholder="General: ${S.settings.reminders.daysBefore} días"></label>` : ''}
      <label class="field"><span>Notas</span><textarea class="input" name="notes" rows="2">${esc(d.notes)}</textarea></label></details>`;
    sh.setBody(h);
    if (!one) fe = freqEditor($('[data-freq]', sh.body), d.freq);
  }
  draw();
  sh.body.addEventListener('click', (e) => {
    const sg = e.target.closest('[data-seg]');
    if (sg) {
      sync();
      if (sg.dataset.seg === 'kind') {
        d.kind = sg.dataset.v; const c = findCat(d.categoryId); if (c && c.kind !== d.kind) d.categoryId = null;
        if (d.kind === 'transfer') { d.variable = false; if (!d.toAccountId || d.toAccountId === d.accountId) { const o = activeAccounts().find((a) => a.id !== d.accountId); d.toAccountId = o ? o.id : null; } }
        if (d.kind === 'income') d.variable = false;
      }
      if (sg.dataset.seg === 'var') d.variable = sg.dataset.v === '1';
      draw(); return;
    }
    const cb = e.target.closest('[data-cat]');
    if (cb) { d.categoryId = cb.dataset.cat === d.categoryId ? null : cb.dataset.cat; $('[data-catbox]', sh.body).innerHTML = catChips(d.kind, d.categoryId); return; }
    const nc = e.target.closest('[data-newcat]');

  });
  sh.body.addEventListener('change', (e) => { if (e.target.name === 'variableInc') { sync(); d.variable = e.target.checked; if (d.variable && d.amount && d.min == null) { d.min = d.amount; d.max = d.amount; } draw(); } });
  $('[data-save]', sh.el).onclick = () => {
    sync();
    const one = scope === 'one';
    if (d.kind === 'income' && d.variable && !one) {
      if (!(d.min >= 0) || !(d.max > 0) || d.max < d.min) return toast('Escribe un mínimo y un máximo válidos (el máximo debe ser mayor).', 'error');
      d.amount = round2((d.min + d.max) / 2);
    } else if (!(d.amount > 0)) return toast('Escribe un monto mayor a cero.', 'error');
    if (d.kind === 'transfer') {
      if (!d.accountId || !d.toAccountId) return toast('Elige las dos cuentas de la transferencia.', 'error');
      if (d.accountId === d.toAccountId) return toast('La cuenta de origen y la de destino deben ser distintas.', 'error');
    } else if (activeAccounts().length && !d.accountId) return toast(d.kind === 'expense' ? 'Elige con qué pagaste: efectivo, débito, vales…' : 'Elige una cuenta.', 'error');
    if (one && !D.valid(d.date)) return toast('Elige una fecha.', 'error');
    if (!d.name) d.name = d.kind === 'transfer' ? `Transferencia a ${accName(d.toAccountId)}` : d.categoryId ? catName(d.categoryId, false) : KIND_LABEL[d.kind];
    const data = { kind: d.kind, name: d.name, amount: d.amount, variable: d.kind !== 'transfer' && d.variable, min: d.kind === 'income' && d.variable ? d.min : null, max: d.kind === 'income' && d.variable ? d.max : null,
      accountId: d.accountId, toAccountId: d.kind === 'transfer' ? d.toAccountId : null, categoryId: d.kind === 'transfer' ? null : d.categoryId, notes: d.notes, remindDays: d.kind === 'expense' ? d.remindDays : '', freq: d.freq };
    let saved = rule;
    if (scope === 'new' || scope === 'dup') { saved = Object.assign({ id: uid(), exc: {}, pauses: [], created: D.today() }, data); S.rules.push(saved); }
    else if (scope === 'all') Object.assign(rule, data);
    else if (scope === 'future') saved = splitRule(rule, occ, data);
    else if (scope === 'one') {
      const prev = rule.exc[occ.key] || {}; const e = Object.assign({}, prev);
      e.amount = d.amount; e.accountId = d.accountId !== rule.accountId ? d.accountId : undefined;
      e.categoryId = d.categoryId !== rule.categoryId ? d.categoryId : undefined;
      e.name = d.name !== rule.name ? d.name : undefined; e.notes = d.notes !== (rule.notes || '') ? d.notes : undefined;
      const natural = adjustDate(occ.key, adjustMode(rule.freq)); e.date = d.date !== natural ? d.date : undefined;

    save(); sh.close(); render();
    toast(scope === 'new' || scope === 'dup' ? ({ income: 'Ingreso guardado.', expense: 'Gasto guardado.', transfer: 'Transferencia guardada.' })[d.kind] : 'Cambios guardados.', 'ok');

/** Copia de un movimiento para "Duplicar": misma regla, pero desde hoy */
function dupPreset(r) {

  p.freq = f; return p;
}
/** Divide una regla: la original termina antes de esta ocurrencia y una nueva continúa con los cambios */
function splitRule(rule, occ, data) {
  const hasPast = occ.n > 1;
  if (!hasPast) { Object.assign(rule, data); return rule; }
  const nr = Object.assign(clone(rule), clone(data), { id: uid(), exc: {}, pauses: clone(rule.pauses || []), created: rule.created });
  for (const k of Object.keys(rule.exc)) if (k >= occ.key) { nr.exc[k] = rule.exc[k]; delete rule.exc[k]; }
  endRuleBefore(rule, occ);
  S.rules.push(nr);
  if (S.settings.period.incomeRuleId === rule.id) S.settings.period.incomeRuleId = nr.id;
  return nr;
}
function endRuleBefore(rule, occ) {

}
function removeRule(rule) {

}
function checkBudgetFor(catId) {

    else if (bi.level === 'warn') toast(`Llevas ${Math.round(bi.pct)}% del presupuesto de ${c.name}.`, 'warn');

}
async function askScope(rule, occ, verb = 'Editar') {
  if (rule.freq.type === 'once') return 'all';
  const opts = [];
  if (occ) opts.push({ value: 'one', label: 'Solo esta vez', desc: fmtDate(occ.date, 'long') });
  if (occ) opts.push({ value: 'future', label: 'Esta y las siguientes', desc: 'Las anteriores no cambian' });
  opts.push({ value: 'all', label: 'Todas', desc: verb === 'Eliminar' ? 'Borra el movimiento y su historial' : 'También cambia las que ya pasaron', danger: verb === 'Eliminar' });
  return chooseDlg(`${verb} movimiento recurrente`, opts, `"${esc(rule.name)}" se repite. ¿A cuáles aplica?`);
}
async function editRule(rule, occ) {

async function deleteRule(rule, occ) {

  else { rule.pauses.push({ from: t }); toast('Movimiento en pausa: no se generarán fechas desde hoy.'); }
  save(); render();
}

    if (st.mode === 'manual') alloc = st.manual; else alloc = allocate(st.amount || 0, st.mode, goalItems(gs)).alloc;
    const entries = Object.entries(alloc).filter(([, a]) => a > 0); if (!entries.length) return toast('No hay nada que repartir.', 'error');
    for (const [gid, a] of entries) findGoal(gid).history.push({ id: uid(), date: D.today(), amount: round2(a), fromAccountId: acc, note: 'Reparto de ahorro' });
    save(); sh.close(); render(); toast(`Repartiste ${money(sum(entries, (x) => x[1]))} entre ${entries.length} ${entries.length === 1 ? 'meta' : 'metas'}.`, 'ok');
  };
}

/** Deuda para el simulador: monto, fecha límite, cuenta de la que sale y cómo pagarla */
function openDebtForm(debt = null) {
  const t = D.today(); const liquid = activeAccounts().filter(isLiquidAcc);
  const d = debt ? clone(debt) : { name: '', amount: null, due: D.add(t, 30), accountId: (liquid.find((a) => a.type === 'debit') || liquid[0] || {}).id || null, plan: 'split' };
  let plan = d.plan || 'split';
  const sh = openSheet({ title: debt ? 'Editar deuda' : 'Agregar deuda', tall: true, foot: `${debt ? `<button type="button" class="btn danger" data-del aria-label="Quitar deuda">${IC.trash}</button>` : '<button type="button" class="btn ghost" data-close>Cancelar</button>'}<button type="button" class="btn" data-save>Guardar</button>` });
  const pd = () => paydayDates(t, D.add(t, 400));
  const hint = () => {
    const v = readFields(sh.body); const due = D.valid(v.due) ? v.due : null; if (!due) return '';
    const n = pd().filter((x) => x <= due).length;
    return n ? `Antes de esa fecha cobras ${n === 1 ? '1 vez' : n + ' veces'}.` : 'No cobras antes de esa fecha.';
  };
  sh.setBody(`<div class="field"><span>¿Cuánto debes?</span>${moneyInput('amount', d.amount, { big: true })}</div>
    <label class="field"><span>¿A quién o de qué?</span><input class="input" name="name" value="${esc(d.name)}" placeholder="Ej. Préstamo de mi hermano" autocomplete="off"></label>
    <label class="field"><span>Fecha límite para pagarla</span><input class="input" type="date" name="due" value="${esc(d.due)}" min="${t}"><span class="hint" data-hint>${esc('')}</span></label>
    ${liquid.length ? `<label class="field"><span>¿De qué cuenta la pagas?</span><select class="input" name="accountId">${accountOptions(d.accountId, { filter: isLiquidAcc })}</select></label>` : ''}
    <div class="field"><span>¿Cómo la quieres pagar?</span>${segHTML('plan', [['asap', 'Próximo cobro'], ['split', 'Dividir'], ['due', 'Fecha límite']], plan)}</div>
    <p class="muted small" data-plan-hint></p>`);
  const PH = { asap: 'Se paga completa con tu primer cobro.', split: 'Se divide en partes iguales entre los cobros que caen antes de la fecha límite.', due: 'Se paga completa el último día.' };
  const upd = () => { const h1 = $('[data-hint]', sh.body); if (h1) h1.textContent = hint(); const h2 = $('[data-plan-hint]', sh.body); if (h2) h2.textContent = PH[plan]; };
  upd();
  sh.body.addEventListener('change', upd);
  sh.body.addEventListener('click', (e) => { const b = e.target.closest('[data-seg="plan"]'); if (!b) return; plan = b.dataset.v; $$('[data-seg="plan"]', sh.body).forEach((x) => x.setAttribute('aria-pressed', x === b)); upd(); });
  $('[data-save]', sh.el).onclick = () => {
    const v = readFields(sh.body); const amount = parseAmount(v.amount);
    if (!(amount > 0)) return toast('Escribe cuánto debes.', 'error');
    if (!D.valid(v.due) || v.due < t) return toast('Elige una fecha límite de hoy en adelante.', 'error');
    const data = { name: (v.name || '').trim() || 'Deuda', amount, due: v.due, accountId: v.accountId || null, plan };
    if (debt && (debt.due !== data.due)) delete S.sim.split['debt:' + debt.id];   // cambian los cobros: los montos elegidos ya no aplican
    if (debt) Object.assign(debt, data); else S.sim.debts.push(Object.assign({ id: uid(), created: t }, data));
    if (D.valid(UI.sd.date) && UI.sd.date < v.due) UI.sd.date = v.due;   // que la simulación llegue a la fecha límite
    save(); sh.close(); render(); toast(debt ? 'Deuda actualizada.' : 'Deuda agregada a la simulación.', 'ok');
  };
  const del = $('[data-del]', sh.el);
  if (del) del.onclick = () => { S.sim.debts = S.sim.debts.filter((y) => y.id !== debt.id); delete S.sim.split['debt:' + debt.id]; save(); sh.close(); render(); };
}
/** ¿Qué se está dividiendo? key = 'debt:id' o 'card:id:fechaLímite' */
function splitTarget(key) {
  const t = D.today(); const [kind, id, due] = String(key).split(':');
  if (kind === 'debt') { const x = S.sim.debts.find((y) => y.id === id); return x ? { name: x.name, total: +x.amount, due: x.due, from: t, est: false } : null; }
  const a = findAcc(id); if (!a) return null; const c = cardInfo(a);
  const pend = c.pendingLast > 0 && due === c.dueLast;
  return { name: a.name, total: pend ? c.pendingLast : c.nextStatement, due, from: pend ? t : c.nextCut, est: !pend };
}
/** Elegir cuánto cubrir de una deuda en cada cobro (forma de pago "Dividir") */
function openSplitEditor(key) {
  const tg = splitTarget(key); if (!tg) return;
  const t = D.today(); const dates = planDates('split', tg.from, tg.due, paydayDates(t, tg.due));
  if (dates.length < 2) return toast('Antes de la fecha límite solo cae un cobro.', 'error');
  const saved = S.sim.split[key] || {};
  const sh = openSheet({ title: 'Cuánto pagar en cada cobro', tall: true, foot: `<button type="button" class="btn ghost" data-reset>Repartir igual</button><button type="button" class="btn" data-save>Guardar</button>` });
  const last = dates.length - 1;
  sh.setBody(`<p style="margin:0 0 .25rem"><b>${esc(tg.name)}</b>: ${tg.est ? 'unos ' : ''}<span class="num">${esc(money(tg.total))}</span> antes del ${esc(fmtDate(tg.due, 'long'))}.</p>
    <p class="muted small" style="margin-top:0">Escribe cuánto quieres cubrir en cada cobro. Los que dejes vacíos se reparten por igual lo que falte, y el último cobro paga el resto para que quede saldada a tiempo.${tg.est ? ' Como el monto del corte es aproximado, el último cobro se ajusta a lo que salga.' : ''}</p>
    <div class="split-list">${dates.map((d, i) => i < last
    ? `<label class="split-row"><span class="sr-l"><b>Cobro del ${esc(fmtDate(d, 'day'))}</b><small>${i === 0 ? 'Primer pago' : `Pago ${i + 1} de ${dates.length}`}</small></span>${moneyInput('p' + i, saved[d], { attrs: `data-d="${d}" aria-label="Monto para el cobro del ${esc(fmtDate(d, 'long'))}"` })}</label>`
    : `<div class="split-row"><span class="sr-l"><b>Cobro del ${esc(fmtDate(d, 'day'))}</b><small>Último pago: el resto</small></span><span class="sr-rest" data-rest></span></div>`).join('')}</div>
    <div class="split-sum" data-sum role="status"></div>`);
  const read = () => { const c = {}; let bad = false; $$('[data-d]', sh.body).forEach((el) => { const v = el.value.trim(); if (v === '') return; const n = parseAmount(v); if (isNaN(n) || n < 0) bad = true; else c[el.dataset.d] = n; }); return { c, bad }; };
  const upd = () => {
    const { c, bad } = read(); const parts = splitParts(tg.total, dates, c);
    $$('[data-d]', sh.body).forEach((el, i) => { el.placeholder = amountField(parts[i]); });
    $('[data-rest]', sh.body).textContent = money(parts[last]);
    const fixed = round2(sum(Object.values(c))); const over = round2(fixed - tg.total); const box = $('[data-sum]', sh.body);
    if (bad) { box.className = 'split-sum bad'; box.textContent = 'Revisa los montos: escribe solo números.'; }
    else if (over > 0.004) { box.className = 'split-sum bad'; box.textContent = `Te pasas por ${money(over)}: lo que escribiste suma ${money(fixed)} y debes ${money(tg.total)}.`; }
    else if (!Object.keys(c).length) { box.className = 'split-sum'; box.textContent = `Sin montos elegidos: se reparte igual, unos ${money(parts[0])} por cobro.`; }
    else { box.className = 'split-sum'; box.textContent = `Elegiste ${money(fixed)}. Falta cubrir ${money(round2(tg.total - fixed))}, que se reparte en los cobros vacíos y el último.`; }
    return { c, bad, over };
  };
  upd();
  sh.body.addEventListener('input', upd);
  $('[data-reset]', sh.el).onclick = () => { $$('[data-d]', sh.body).forEach((el) => { el.value = ''; }); upd(); };
  $('[data-save]', sh.el).onclick = () => {
    const { c, bad, over } = upd();
    if (bad) return toast('Revisa los montos.', 'error');
    if (over > 0.004) return toast(`Te pasas por ${money(over)} de lo que debes.`, 'error');
    if (Object.keys(c).length) S.sim.split[key] = c; else delete S.sim.split[key];
    save(); sh.close(); render(); toast(Object.keys(c).length ? 'Montos guardados en la simulación.' : 'Se reparte por igual.', 'ok');
  };
}

/* ---------- Respaldo, importación y CSV ---------- */
async function shareOrDownload(blob, name, title) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title }); return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); return true;
}
async function exportJSON() {
  const payload = { app: 'mis-finanzas', version: CONFIG.app.version, exportedAt: new Date().toISOString(), data: S };
  const ok = await shareOrDownload(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }), `mis-finanzas-respaldo-${D.today()}.json`, 'Respaldo de Mis Finanzas');
  if (!ok) return;
  S.settings.backup.last = D.today(); S.settings.backup.snoozed = null; save(); render(); SHEETS.forEach((s) => s.refresh && s.refresh());
  toast('Respaldo exportado. Guárdalo fuera del teléfono (correo, Drive…).', 'ok');
}
function importJSON() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text()); const data = obj && obj.data ? obj.data : obj;
      if (!data || !Array.isArray(data.rules) || !Array.isArray(data.accounts)) throw new Error('El archivo no parece un respaldo de esta app.');
      if (!(await confirmDlg(`Se reemplazarán todos tus datos actuales con el respaldo "${esc(f.name)}".`, { title: 'Importar respaldo', ok: 'Reemplazar mis datos', danger: true }))) return;
      S = migrate(data); S.setupDone = true; save(); ensureHolidays(); applyAppearance(); closeAllSheets(); UI.tab = 'home'; render(); toast('Respaldo importado.', 'ok');
    } catch (e) { toast('No se pudo importar: ' + e.message, 'error'); }
  };
  inp.click();
}
function exportCSV() {
  const t = D.today(); let from = S.startDate;
  for (const r of S.rules) if (r.freq.start < from) from = r.freq.start;
  from = D.max(from, D.add(t, -365 * 5));
  const sep = S.settings.format.decimalSep === ',' ? ';' : ',';
  const q = (s) => { s = String(s == null ? '' : s); return /[";,\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = (n) => String(round2(n)).replace('.', S.settings.format.decimalSep);
  const st = { done: 'Realizado', pending: 'Por confirmar', skipped: 'Omitido', scheduled: 'Programado' };
  const rows = [['Fecha', 'Tipo', 'Nombre', 'Categoría', 'Subcategoría', 'Cuenta', 'Cuenta destino', 'Monto', 'Estado', 'Notas']];
  for (const o of allOccurrences(from, t)) {
    const c = findCat(o.categoryId); const parent = c && c.parentId ? findCat(c.parentId) : null;
    const signed = o.kind === 'expense' ? -o.amount : o.amount;
    rows.push([fmtDate(o.date, 'full'), KIND_LABEL[o.kind], o.name, parent ? parent.name : c ? c.name : '', parent ? c.name : '', accName(o.accountId), o.toAccountId ? accName(o.toAccountId) : '', num(signed), st[o.status], o.notes]);
  }
  for (const g of S.goals) for (const h of g.history || []) rows.push([fmtDate(h.date, 'full'), h.amount > 0 ? 'Abono a meta' : 'Retiro de meta', g.name, '', '', h.fromAccountId ? accName(h.fromAccountId) : '', '', num(h.amount), 'Realizado', h.note || '']);
  const csv = '﻿' + rows.map((r) => r.map(q).join(sep)).join('\r\n');
  shareOrDownload(new Blob([csv], { type: 'text/csv' }), `mis-finanzas-movimientos-${t}.csv`, 'Movimientos').then((ok) => ok && toast(`Se exportaron ${rows.length - 1} movimientos.`, 'ok'));
}

async function deleteSample() {
  if (!(await confirmDlg('Se borrarán las cuentas, movimientos y metas de ejemplo. Lo que tú hayas agregado se queda.', { title: 'Borrar datos de ejemplo', ok: 'Borrar', danger: true }))) return;
  const gone = new Set(S.accounts.filter((a) => a.sample).map((a) => a.id));
  S.accounts = S.accounts.filter((a) => !a.sample);
  S.rules = S.rules.filter((r) => !r.sample && !gone.has(r.accountId) && !gone.has(r.toAccountId));
  S.goals = S.goals.filter((g) => !g.sample);
  for (const g of S.goals) { if (gone.has(g.accountId)) g.accountId = null; for (const h of g.history) if (gone.has(h.fromAccountId)) h.fromAccountId = null; }
  if (gone.has(S.settings.savings.fromAccountId)) S.settings.savings.fromAccountId = null;
  for (const id of S.meta.sampleBudgets || []) { const c = findCat(id); if (c) c.budget = null; }
  if (S.settings.period.incomeRuleId && !findRule(S.settings.period.incomeRuleId)) S.settings.period = { mode: 'month', incomeRuleId: null };
  S.meta.sample = false; S.meta.sampleBudgets = []; save(); closeAllSheets(); render(); toast('Datos de ejemplo borrados.', 'ok');
  if (!S.accounts.length && !S.rules.length) { S.setupDone = false; save(); startWizard(); }
}

function wzReadAccounts() {
  $$('.wz-card', $('#wizard')).forEach((card) => {
    const a = W.accounts[+card.dataset.i]; if (!a) return;
    $$('[data-wa]', card).forEach((el) => {
      const k = el.dataset.wa; let v = el.value;
      if (k === 'initial' || k === 'limit') v = parseAmount(v) || 0;
      if (k === 'stmt') v = v === '' ? null : parseAmount(v);
      if (k === 'cutDay' || k === 'dueDay') v = clampN(parseInt(v, 10) || 1, 1, 31);
      if (k === 'rate') v = parseFloat(String(v).replace(',', '.')) || '';
      a[k] = v;
    });
  });
}
function wzCommitAccounts() {
  wzReadAccounts(); const t = D.today();
  const keep = W.accounts.filter((a) => String(a.name || '').trim());
  if (keep.some((a) => a.type === 'vouchers')) ensureVoucherCategory();
  for (const a of keep) {
    const signed = a.type === 'credit' ? -Math.abs(+a.initial || 0) : +a.initial || 0;
    const ex = findAcc(a.id);
    const cr = a.type === 'credit'; const hasStmt = cr && a.stmt != null && !isNaN(a.stmt);
    const data = { name: a.name.trim(), type: a.type, color: a.color || '#2B50D6', rate: a.type === 'savings' ? a.rate || '' : '', limit: cr ? a.limit || 0 : '', cutDay: cr ? a.cutDay || 5 : '', dueDay: cr ? a.dueDay || 25 : '',
      stmtAmount: hasStmt ? a.stmt : null, stmtCut: hasStmt ? lastCutFor(a.cutDay || 5) : null };
    if (ex && a._cur != null) {
      // cuenta que ya existía: si cambió el saldo se registra un ajuste (no se pierde el historial)
      Object.assign(ex, data);
      const diff = round2(signed - a._cur);
      if (Math.abs(diff) >= 0.01) S.rules.push({ id: uid(), kind: 'adjust', name: 'Ajuste de saldo', amount: diff, variable: false, accountId: ex.id, toAccountId: null, categoryId: null, notes: '', freq: normFreq({ type: 'once', start: t }), exc: {}, pauses: [], created: t });
      a._cur = signed;
    } else if (ex) Object.assign(ex, data, { initial: signed, balanceDate: t });
    else S.accounts.push(Object.assign({ id: a.id, initial: signed, balanceDate: t }, data));
  }
  const ids = new Set(keep.map((a) => a.id));
  S.accounts = S.accounts.filter((a) => ids.has(a.id) || a.archived || S.rules.some((r) => r.accountId === a.id || r.toAccountId === a.id));
  save();
}
function finishWizard() {
  const t = D.today();
  if (!S.setupDone) { S.startDate = t; for (const r of S.rules) if (!r.sample) r.created = r.created && r.created < t ? r.created : t; for (const a of S.accounts) if (!a.sample) a.balanceDate = t; }
  S.setupDone = true; S.meta.savingsAppliedUntil = S.meta.savingsAppliedUntil || D.add(periodOf(t).start, -1);
  save(); hideWizard(); UI.tab = 'home'; render();
  toast(S.settings.profile.name ? `¡Listo, ${S.settings.profile.name}! Usa el botón + para registrar gastos.` : '¡Listo! Usa el botón + para registrar gastos.', 'ok');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-w]'); if (!b || !b.closest('#wizard')) return; const a = b.dataset.w;
  if (W.step === 2 && a !== 'delacc' && a !== 'addacc') wzReadAccounts();
  if (a === 'sample') return loadSample();
  if (a === 'skipall') return finishWizard();
  if (a === 'next' || a === 'skip') {
    if (W.step === 2) { if (a === 'next') wzCommitAccounts(); }
    if (W.step === 6) return finishWizard();
    W.step++; return drawWizard();
  }
  if (a === 'back') { if (W.step === 2) wzCommitAccounts(); W.step = Math.max(0, W.step - 1); return drawWizard(); }
  if (a === 'addacc') { wzReadAccounts(); W.accounts.push({ id: uid(), name: '', type: 'debit', initial: 0, color: CONFIG.palette[W.accounts.length % CONFIG.palette.length] }); drawWizard(); setTimeout(() => { const c = $$('.wz-card [data-wa="name"]'); c[c.length - 1].focus(); }, 50); return; }
  if (a === 'delacc') { wzReadAccounts(); W.accounts.splice(+b.dataset.i, 1); return drawWizard(); }
  if (a === 'addinc') return openMoveForm({ kind: 'income', recurring: true, lockKind: true, preset: { kind: 'income', categoryId: firstCatId('income'), freq: normFreq({ type: 'semimonthly', start: D.today() }) }, onSaved: () => drawWizard() });
  if (a === 'delinc') { S.rules = S.rules.filter((r) => r.id !== b.dataset.id); save(); return drawWizard(); }
  if (a === 'addgoal') return openGoalForm(null, { onSaved: () => drawWizard() });
});

/** Al abrir la app (una vez al día) muestra los pagos próximos */
function showDailyReminder() {
  if (!S.setupDone || !S.settings.reminders.enabled) return;
  const t = D.today(); if (S.meta.reminderShown === t) return;
  const items = [...dueReminders(), ...cardDues(D.add(t, -30), D.add(t, +S.settings.reminders.daysBefore || 0)).filter((c) => !c.estimate)].sort(sortByDate);
  const pend = pendingConfirm();
  if (!items.length && !pend.length) return;
  S.meta.reminderShown = t; save();
  const sh = openSheet({
    title: items.length ? 'Pagos próximos' : 'Por confirmar',
    body: `${items.length ? `<div class="list">${items.map((o) => occRow(o)).join('')}</div>` : ''}${pend.length ? `<div class="alert warn mt"><span class="a-ico">${IC.pen}</span><span class="a-body">${pend.length === 1 ? 'Tienes 1 movimiento' : `Tienes ${pend.length} movimientos`} por confirmar<small>Toca "Revisar" para registrar los montos reales.</small></span></div>` : ''}`,
    foot: `${pend.length ? '<button type="button" class="btn ghost" data-act="showPending">Revisar</button>' : ''}<button type="button" class="btn" data-close>Entendido</button>`,
  });
  void sh;
}
async function showNotification(title, body, tag) {
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(title, { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' }); return true; }
    }
  } catch (e) { /* seguimos con el método simple */ }
  try { new Notification(title, { body, tag, icon: 'icons/icon-192.png' }); return true; } catch (e) { return false; }
}
async function toggleNotifications(el) {
  const r = S.settings.reminders;
  if (!el.checked) { r.browser = false; save(); render(); return; }
  if (!('Notification' in window)) { el.checked = false; toast('Este navegador no permite notificaciones. En iPhone, primero agrega la app a la pantalla de inicio.', 'warn', { ms: 7000 }); return; }
  let perm = Notification.permission;
  if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; } }
  if (perm !== 'granted') { el.checked = false; r.browser = false; save(); toast('Permiso denegado. Puedes activarlo en los ajustes del navegador.', 'warn'); SHEETS.forEach((s) => s.refresh && s.refresh()); return; }
  r.browser = true; save(); render(); SHEETS.forEach((s) => s.refresh && s.refresh());
  showNotification('Notificaciones activadas', 'Te avisaremos de tus pagos próximos al abrir la app.', 'activadas');
}
/** Envía notificaciones del navegador de pagos que entran en su ventana (una sola vez cada uno) */
async function notifyUpcoming() {
  if (!S.setupDone || !S.settings.reminders.enabled || !S.settings.reminders.browser) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const t = D.today(); const sent = S.meta.notified;
  const items = [...dueReminders().map((o) => ({ id: o.id, title: `${o.name}: ${money(o.amount)}`, body: `Se paga ${relDay(o.date).toLowerCase()} desde ${accName(o.accountId)}.` })),
    ...cardDues(t, D.add(t, +S.settings.reminders.daysBefore || 0)).filter((c) => !c.estimate).map((c) => ({ id: 'card' + c.acc.id + c.date, title: `Pago de ${c.acc.name}: ${money(c.amount)}`, body: `Fecha límite ${relDay(c.date).toLowerCase()}.` }))];
  for (const it of items) { if (sent[it.id]) continue; if (await showNotification(it.title, it.body, it.id)) sent[it.id] = t; }
  for (const k of Object.keys(sent)) if (D.diff(sent[k], t) > 90) delete sent[k];
  save();
}
function afterOpen() {
  ensureHolidays();
  autoApplySavings();
  showDailyReminder();
  notifyUpcoming();
}
let lastDay = null;
function tick() {
  const t = D.today();
  if (lastDay && lastDay !== t) { invalidate(); afterOpen(); render(); }
  lastDay = t;
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('Hay una versión nueva de la app.', 'info', { action: { label: 'Actualizar', fn: () => location.reload() }, ms: 15000 });
  });
}
function boot() {
  load();
  applyAppearance();
  ensureHolidays();
  render();
  if (!S.setupDone) startWizard(); else afterOpen();
  lastDay = D.today();
  setInterval(() => { tick(); notifyUpcoming(); }, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.setupDone) { tick(); afterOpen(); } });
  registerSW();
}
boot();
</script>
</body>
</html>
