<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Finanzas personales en tu celular: ingresos, gastos, metas y proyección de ahorro. Tus datos se quedan en tu dispositivo.">
<meta name="theme-color" content="#0F172A">
<meta name="color-scheme" content="light dark">
<!-- PWA: manifest e íconos (archivos aparte, en la misma carpeta) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iPhone: abrir a pantalla completa cuando se agrega a inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<!-- Tipografía (UI/UX Pro Max, "Dashboard Data"): Fira Sans para textos y Fira Code para cifras.
     Sin internet se usa la fuente del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ESTILOS — sistema de diseño
   Estilo plano: fondo de un solo color y tarjetas sólidas para que
   el texto siempre tenga buen contraste. Paleta de UI/UX Pro Max para
   "Personal Finance Tracker": azul de confianza y verde de ganancia.
   Íconos vectoriales de una sola familia (sin emojis).
   El color principal (--primary) se cambia en Ajustes > Apariencia.
   ========================================================= */
:root{
  /* marca */
  --primary:#2563EB;
  --on-primary:#FFFFFF;
  --primary-soft:color-mix(in srgb,var(--primary) 14%,transparent);
  --primary-text:color-mix(in srgb,var(--primary) 82%,#000);
  /* superficies (modo claro: nunca blanco puro de fondo) */
  --bg:#F1F5F9;
  --surface:#FFFFFF;
  --surface-strong:#FFFFFF;
  --surface-2:#EEF2F7;
  --field:#FFFFFF;
  --glass-border:#E2E8F0;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E2E8F0;
  --scrim:rgba(15,23,42,.5);
  --shadow:0 1px 2px rgba(15,23,42,.05);
  /* semánticos (texto) */
  --income:#047857;
  --expense:#C81E1E;
  --warn:#9A5B05;
  --transfer:#4F46E5;
  /* gráficas (paleta validada: CVD y contraste) */
  --c-1:#2a78d6; --c-2:#eb6834; --c-3:#1baf7a; --c-rest:#94A3B8;
  --c-grid:#E2E8F0; --c-axis:#64748B;
  --st-good:#0ca30c; --st-warn:#fab219; --st-bad:#d03b3b;
  /* tipografía y medidas */
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-num:'Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --tap:48px;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --dur:160ms; --ease:cubic-bezier(.2,.8,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A;--surface:#172033;--surface-strong:#1B2538;--surface-2:#222D42;--field:#131B2B;
    --glass-border:#26314A;--shadow:none;
    --ink:#F1F5F9;--muted:#94A3B8;--line:#2A3550;--scrim:rgba(2,6,23,.7);
    --income:#34D399;--expense:#F87171;--warn:#FBBF24;--transfer:#A5B4FC;
    --primary-text:color-mix(in srgb,var(--primary) 50%,#fff);
    --primary-soft:color-mix(in srgb,var(--primary) 28%,transparent);
    --c-1:#3987e5;--c-2:#d95926;--c-3:#199e70;--c-rest:#64748B;--c-grid:#26314A;--c-axis:#94A3B8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A;--surface:#172033;--surface-strong:#1B2538;--surface-2:#222D42;--field:#131B2B;
  --glass-border:#26314A;--shadow:none;
  --ink:#F1F5F9;--muted:#94A3B8;--line:#2A3550;--scrim:rgba(2,6,23,.7);
  --income:#34D399;--expense:#F87171;--warn:#FBBF24;--transfer:#A5B4FC;
  --primary-text:color-mix(in srgb,var(--primary) 50%,#fff);
  --primary-soft:color-mix(in srgb,var(--primary) 28%,transparent);
  --c-1:#3987e5;--c-2:#d95926;--c-3:#199e70;--c-rest:#64748B;--c-grid:#26314A;--c-axis:#94A3B8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button,[role="button"],label.radio,label.switch,summary{cursor:pointer}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 70%,#fff);outline-offset:2px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;text-wrap:balance}
svg{flex:none}
.num,.amt,.kv>span:last-child,.cal-amt,.money-input,.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.75rem}
.strong{font-weight:600}
.in{color:var(--income)}
.out{color:var(--expense)}
.warn-t{color:var(--warn)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:.625rem}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:.75rem}
.mt{margin-top:1rem}.mt-s{margin-top:.5rem}.mb{margin-bottom:1rem}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{display:inline-grid;place-items:center;width:20px;height:20px}
.i svg{width:100%;height:100%}

/* ---------- Tarjetas (superficie sólida) ---------- */
.glass,.panel,.alert,.wz-card{background:var(--surface);border:1px solid var(--glass-border);box-shadow:var(--shadow)}

/* ---------- Estructura ---------- */
.app{max-width:600px;margin:0 auto;min-height:100dvh;padding-bottom:calc(88px + var(--safe-b))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(var(--safe-t) + .625rem) 1rem .625rem;background:var(--bg);border-bottom:1px solid var(--bg)}
.topbar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.topbar-title small{color:var(--muted);font-size:.875rem;font-weight:500}
.topbar-title strong{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;flex:none;width:var(--tap);height:var(--tap);border-radius:14px;border:0;background:none;display:grid;place-items:center;color:var(--ink);transition:background var(--dur) var(--ease)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--expense);color:#fff;font-size:.6875rem;font-weight:700;line-height:18px;text-align:center}
.view{padding:.25rem 1rem 1.5rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 .5rem calc(var(--safe-b) + .375rem)}
.tabbar-inner{display:flex;max-width:584px;margin:0 auto;border-radius:24px;background:var(--surface-strong);border:1px solid var(--glass-border);box-shadow:0 4px 16px rgba(2,6,23,.12);padding:4px}
.tab{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-size:clamp(11px,.75rem,13px);font-weight:500;padding:4px 0;border-radius:20px;min-width:0;transition:color var(--dur) var(--ease)}
.tab-ico{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background var(--dur) var(--ease)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"] .tab-ico{background:var(--primary-soft);color:var(--primary-text)}
.fab{position:fixed;right:max(1rem,calc(50% - 300px + 1rem));bottom:calc(88px + var(--safe-b));z-index:25;width:60px;height:60px;border-radius:20px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 16px rgba(2,6,23,.22);transition:transform var(--dur) var(--ease)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.95)}

/* ---------- Bloque principal de Inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:1.125rem 1.25rem;margin:.25rem 0 1rem;color:var(--on-primary);background:var(--primary)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.hero-label{font-size:.9375rem;font-weight:500;opacity:.92}
.hero-link{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:inherit;font-weight:600;font-size:.875rem;min-height:40px;padding:0 .875rem;border-radius:20px}
.hero-amount{font-size:clamp(2.25rem,11vw,3rem);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:.375rem 0 .875rem;white-space:nowrap}
.hero-amount.neg::before{content:"Saldo negativo ";display:block;font-size:.8125rem;font-weight:600;letter-spacing:0;opacity:.95}
.track{position:relative;height:34px}
.track-line{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.track-fill{position:absolute;left:0;top:15px;height:4px;border-radius:2px;background:var(--on-primary)}
.track-tick{position:absolute;top:9px;width:3px;height:16px;border-radius:2px;transform:translateX(-50%);background:rgba(255,255,255,.7)}
.track-tick.inc{top:4px;height:26px;width:5px;background:var(--on-primary)}
.track-now{position:absolute;top:5px;width:24px;height:24px;border-radius:50%;background:var(--on-primary);border:5px solid var(--primary);box-shadow:0 0 0 2px var(--on-primary);transform:translateX(-50%)}
.track-ends{display:flex;justify-content:space-between;gap:.5rem;font-size:.8125rem;font-weight:500;opacity:.92;margin-top:.125rem}
.hero-foot{margin-top:.875rem;padding-top:.75rem;border-top:1px solid rgba(255,255,255,.22);font-size:.9375rem;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem 1rem;flex-wrap:wrap}
.hero-foot b{font-weight:600;font-size:1.0625rem;font-family:var(--font-num)}

/* ---------- Paneles y listas ---------- */
.panel{border-radius:var(--r-lg);padding:1rem;margin-bottom:.875rem}
.panel.flat{background:none;border:0;box-shadow:none;padding:.25rem 0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.625rem}
.panel-h h2{margin:0;font-size:1.0625rem}
.panel-h .sub{color:var(--muted);font-size:.8125rem;font-weight:500;text-align:right}
.lead-q{margin:-.25rem 0 .75rem;color:var(--muted);font-size:.875rem}
.link{background:none;border:0;color:var(--primary-text);font-weight:600;padding:.625rem .5rem;margin:-.625rem -.5rem;font-size:.9375rem;min-height:var(--tap)}
.section-title{font-size:.875rem;font-weight:600;color:var(--muted);margin:1.25rem 0 .5rem}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:.75rem;min-height:60px;padding:.5rem .25rem;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;border-radius:0;transition:background var(--dur) var(--ease)}
button.item:active,.item[role="button"]:active{background:var(--surface-2)}
.item:last-child{border-bottom:0}
.item.dim{opacity:.55}
.ico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;background:var(--surface-2);line-height:1;color:var(--ink)}
.ico svg{width:20px;height:20px}
.ico.sm{width:36px;height:36px;border-radius:12px;font-size:1.05rem}
.item-main{flex:1;min-width:0}
.item-title{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{display:block;color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>.item-title{display:inline}
.item-end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.amt{font-weight:500;white-space:nowrap;font-size:.9375rem}
.amt.big{font-family:var(--font);font-size:1.875rem;font-weight:700;letter-spacing:-.02em}
.day-h{display:flex;justify-content:space-between;font-size:.8125rem;font-weight:600;color:var(--muted);padding:.875rem .25rem .25rem;border-bottom:1px solid var(--line)}
.day-h span:last-child{font-family:var(--font-num)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.4375rem 0}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{font-weight:500;text-align:right}
.empty{text-align:center;padding:1.5rem 1rem;color:var(--muted)}
.empty .empty-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto .75rem;background:var(--primary-soft);color:var(--primary-text);font-size:1.75rem}
.empty .empty-ico svg{width:26px;height:26px}
.empty p{margin:.25rem 0 1rem}

/* ---------- Botones y controles ---------- */
.btn{min-height:var(--tap);padding:0 1.125rem;border-radius:15px;border:1px solid transparent;font-weight:600;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;font-size:1rem;transition:opacity var(--dur) var(--ease),background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.outline{background:transparent;border-color:var(--line);color:var(--ink);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--expense) 14%,transparent);color:var(--expense);box-shadow:none}
.btn.sm{min-height:44px;padding:0 .875rem;font-size:.9375rem;border-radius:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.98);opacity:.92}
.btn-row{display:flex;gap:.625rem;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 0;min-width:max-content}
.btn-row>.btn.icon{flex:0 0 var(--tap);min-width:0;padding:0}
.field{display:flex;flex-direction:column;gap:.375rem;margin-bottom:.875rem;min-width:0}
.field>span,.label{font-size:.875rem;font-weight:500;color:var(--muted)}
.field .hint{font-size:.8125rem;color:var(--muted);font-weight:400}
.input{min-height:var(--tap);padding:.625rem .875rem;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);width:100%;min-width:0;font-size:1rem;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2.25rem}
select.input option{background:var(--surface-strong);color:var(--ink)}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.money-wrap{display:flex;align-items:center;gap:.375rem;border-bottom:2px solid var(--line);padding:.25rem 0;transition:border-color var(--dur) var(--ease)}
.money-wrap:focus-within{border-color:var(--primary)}
.money-wrap .sym{font-size:1.5rem;font-weight:600;color:var(--muted)}
.money-input{flex:1;min-width:0;border:0;background:none;font-size:2.25rem;font-weight:600;padding:.125rem 0;outline:none;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.seg{display:flex;background:var(--surface-2);border-radius:15px;padding:4px;gap:4px;margin-bottom:.875rem;border:1px solid var(--line)}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:none;font-weight:500;color:var(--muted);padding:0 .375rem;font-size:.9375rem;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--surface-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(2,6,23,.16)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:1 0 auto;padding:0 .5rem;font-size:.875rem}
.seg.tight{overflow-x:auto;scrollbar-width:none}
.seg.tight::-webkit-scrollbar{display:none}
.seg.tight button{flex:1 0 auto;padding:0 .5rem;font-size:.875rem}
@media (max-width:360px){.seg.tight button{padding:0 .375rem;font-size:.8125rem}}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:0 1rem .25rem}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 .875rem;border-radius:22px;border:1px solid var(--line);background:var(--field);display:inline-flex;align-items:center;gap:.375rem;font-weight:500;white-space:nowrap;flex:none;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chip svg{width:18px;height:18px}
.chip.sm{min-height:44px;padding:0 .75rem;font-size:.875rem}
.chip:active{background:var(--surface-2)}
.chip.sq{width:44px;min-height:44px;padding:0;justify-content:center;border-radius:12px}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:.625rem}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface-strong);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:.375rem;max-height:208px;overflow-y:auto;padding:2px}
.icon-grid button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--muted);display:grid;place-items:center;transition:background var(--dur) var(--ease)}
.icon-grid button svg{width:22px;height:22px}
.icon-grid button[aria-pressed="true"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,var(--surface));color:color-mix(in srgb,var(--gc) 70%,var(--ink))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:56px;padding:.25rem 0}
.switch>span{flex:1}
.switch small{display:block;color:var(--muted);font-size:.8125rem}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:background var(--dur) var(--ease);margin:0;cursor:pointer}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform var(--dur) var(--ease)}
.switch input:checked{background:var(--primary);border-color:var(--primary)}
.switch input:checked::after{transform:translateX(20px)}
.radio-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.875rem}
.radio{display:flex;align-items:flex-start;gap:.75rem;padding:.75rem .875rem;border-radius:var(--r-md);border:1px solid var(--line);background:var(--field);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
button.radio{width:100%;text-align:left;font:inherit;color:inherit}
.radio input{margin:.2rem 0 0;width:20px;height:20px;accent-color:var(--primary);flex:none}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.radio b{display:block;font-weight:500}
.radio small{color:var(--muted)}
.inline-inputs{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.inline-inputs .input{width:auto;flex:1 1 80px}
.input.num{width:84px!important;flex:none!important;text-align:center}
details.more{border-top:1px solid var(--line);margin-top:.5rem}
details.more>summary{list-style:none;min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--primary-text)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'+';font-size:1.25rem}
details.more[open]>summary::after{content:'−'}

/* ---------- Barras, etiquetas y avisos ---------- */
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar.thick{height:14px;border-radius:7px}
.bar>i{position:absolute;top:0;bottom:0;left:0;border-radius:inherit;background:var(--c,var(--primary))}
.bar>i.ghost{opacity:.32}
.bar-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.1875rem .5rem;border-radius:8px;font-size:.75rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge svg{width:13px;height:13px}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--expense) 15%,transparent);color:var(--expense)}
.badge.ok{background:color-mix(in srgb,var(--income) 15%,transparent);color:var(--income)}
.badge.info{background:var(--primary-soft);color:var(--primary-text)}
.alert{display:flex;gap:.75rem;align-items:center;padding:.75rem .875rem;border-radius:var(--r-md);margin-bottom:.5rem;width:100%;text-align:left;color:inherit;transition:transform var(--dur) var(--ease)}
button.alert:active{transform:scale(.99)}
.alert .a-ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:1.1rem}
.alert .a-ico svg{width:19px;height:19px}
.alert .a-body{flex:1;min-width:0;font-size:.9375rem;font-weight:500}
.alert .a-body small{display:block;color:var(--muted);font-weight:400}
.alert .chev{width:18px;color:var(--muted)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--glass-border))}
.alert.warn .a-ico{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.alert.bad{border-color:color-mix(in srgb,var(--expense) 42%,var(--glass-border))}
.alert.bad .a-ico{background:color-mix(in srgb,var(--expense) 15%,transparent);color:var(--expense)}
.alert.info .a-ico{background:var(--primary-soft);color:var(--primary-text)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.stat small{display:block;color:var(--muted);font-size:.8125rem;font-weight:500}
.stat b{display:block;font-size:1.375rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.stat .muted{font-size:.8125rem}
.preview{background:var(--surface-2);border-radius:var(--r-md);padding:.625rem .875rem;margin-top:.25rem;border:1px solid var(--line)}
.preview ol{margin:.25rem 0 0;padding-left:1.25rem}
.preview li{padding:.125rem 0}
.preview .moved{color:var(--warn);font-size:.8125rem}
.goal-head{display:flex;align-items:center;gap:.75rem;margin-bottom:.625rem;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit}
.goal-amt{display:flex;justify-content:space-between;align-items:baseline;margin:.5rem 0 .375rem}
.goal-amt b{font-size:1.375rem;font-weight:700;letter-spacing:-.02em}

/* ---------- Indicadores (gráficas para decidir) ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.625rem;margin-bottom:.875rem}
.kpi{border-radius:var(--r-md);padding:.875rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.kpi small{color:var(--muted);font-size:.8125rem;font-weight:500}
.kpi b{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .kpi-note{font-size:.75rem;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:600;color:var(--ink)}
.status i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc)}
.split{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:2px;margin:.5rem 0 .625rem}
.split>span{display:block;height:100%;min-width:3px;background:var(--c)}
.split>span:first-child{border-radius:7px 0 0 7px}.split>span:last-child{border-radius:0 7px 7px 0}
.legend-rows{display:grid;grid-template-columns:1fr 1fr;gap:.375rem .75rem}
.legend-rows div{display:flex;align-items:center;gap:.5rem;font-size:.875rem;min-width:0}
.legend-rows i{flex:none;width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend-rows b{margin-left:auto;font-family:var(--font-num);font-weight:500}
.hbar{display:grid;grid-template-columns:minmax(0,8.75rem) 1fr;gap:.375rem .75rem;align-items:center}
.hbar-l{font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-t{position:relative;height:20px}
.hbar-t>i{position:absolute;top:2px;bottom:2px;left:0;border-radius:0 4px 4px 0;background:var(--c-1)}
.hbar-t>i.ghost{opacity:.35}
.hbar-t>i.over{background:var(--c-2)}
.hbar-t>.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.hbar-v{grid-column:2;font-size:.75rem;color:var(--muted);margin:-.25rem 0 .25rem;font-family:var(--font-num)}
table.data{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:.5rem}
table.data th,table.data td{padding:.375rem .25rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{font-family:var(--font-num)}
table.data th{color:var(--muted);font-weight:500}
.table-wrap{overflow-x:auto}
details.data-view>summary{list-style:none;min-height:44px;display:flex;align-items:center;font-size:.875rem;font-weight:600;color:var(--primary-text)}
details.data-view>summary::-webkit-details-marker{display:none}

/* ---------- Calendario ---------- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.cal-nav strong{font-size:1.0625rem;text-transform:capitalize;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding:.25rem 0}
.cal-d{min-height:56px;border:1px solid transparent;border-radius:11px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;padding:5px 1px 4px;font-size:.875rem;font-weight:500;min-width:0;color:inherit;gap:1px;transition:background var(--dur) var(--ease)}
.cal-d:active{background:var(--primary-soft)}
.cal-d.out{opacity:.35;background:none}
.cal-d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-d.hol>span:first-child{color:var(--warn);text-decoration:underline dotted}
.cal-amt{font-size:.625rem;font-weight:500;line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap}
.cal-dots{display:flex;gap:2px;margin-top:auto}

/* ---------- Gráficas ---------- */
.chart{position:relative;-webkit-user-select:none;user-select:none;touch-action:pan-y;margin:.25rem 0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--c-grid);stroke-width:1}
.chart .base{stroke:var(--c-axis);stroke-width:1;opacity:.6}
.chart .axis{fill:var(--c-axis);font-size:10px;font-family:var(--font-num)}
.chart .mk-l{fill:var(--ink);font-size:10.5px;font-weight:600;font-family:var(--font)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--surface-2)}
.chart-tip{position:absolute;top:-6px;pointer-events:none;background:var(--surface-strong);color:var(--ink);border:1px solid var(--glass-border);box-shadow:0 8px 24px rgba(2,6,23,.22);font-size:.75rem;padding:.4375rem .625rem;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2;line-height:1.45}
.chart-tip b{font-family:var(--font-num);font-weight:600}
.chart-tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:.375rem;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:.375rem 1rem;font-size:.8125rem;color:var(--muted);margin-top:.25rem}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:.375rem}
.legend i.box{width:12px;height:12px;border-radius:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}
.legend i.faded{opacity:.45}
#sd-debts{scroll-margin-top:84px}
.debt-item{padding:.75rem 0;border-top:1px solid var(--line)}
.debt-item.dim{opacity:.6}
.debt-head{display:flex;align-items:center;gap:.75rem;min-height:44px}
.debt-head .item-main{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.debt-head .item-sub{white-space:normal}
.debt-edit{background:none;border:0;padding:0;color:inherit;font:inherit;min-height:44px;justify-content:center;cursor:pointer}
.plan-chips{margin:.5rem 0 .25rem}
.debt-cycle{margin-top:.5rem;padding:.5rem .75rem;border-radius:var(--r-sm);background:var(--surface-2)}
.debt-cycle .kv{padding:0}
.plan-note{margin:.5rem 0 0;font-size:.875rem;color:var(--muted)}
.pay-pills{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.375rem}
.pay-pill{display:inline-flex;align-items:baseline;gap:.375rem;padding:.3125rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem}
.pay-pill span{color:var(--muted)}
.pay-pill b{font-family:var(--font-num);font-weight:600}
.debt-cycle .pay-pill{background:var(--surface)}
.plan-edit{margin-top:.5rem;min-height:44px}
.wf{display:flex;flex-direction:column;margin-top:.25rem}
.wf-row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:.75rem;row-gap:.375rem;padding:.625rem 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;min-height:44px}
button.wf-row{cursor:pointer}
button.wf-row:active{background:var(--surface-2)}
.wf-row.total{padding:.75rem 0}
.wf-row.end{border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.wf-l{display:flex;align-items:center;gap:.625rem;min-width:0}
.wf-l b{display:block;font-weight:600;font-size:.9375rem;line-height:1.3}
.wf-l small{display:block;color:var(--muted);font-size:.8125rem}
.wf-ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface-2);color:var(--muted);flex:none}
.wf-ico svg{width:18px;height:18px}
.wf-v{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.wf-row.total .wf-v{font-size:1.0625rem}
.wf-bar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.wf-bar i{display:block;height:100%;border-radius:3px;background:var(--c-1)}
.wf-bar i.up{background:var(--income)}
.wf-bar i.down{background:var(--expense)}
.wf-bar i.base{background:var(--c-1)}
.plan-edit svg{width:16px;height:16px}
.split-row{display:grid;grid-template-columns:1fr 9.5rem;align-items:center;gap:.75rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.split-row:last-of-type{border-bottom:0}
.split-row .sr-l b{display:block;font-weight:600}
.split-row .sr-l small{display:block;color:var(--muted);font-size:.8125rem}
.split-row .input{text-align:right;font-family:var(--font-num)}
.split-row .sr-rest{text-align:right;font-family:var(--font-num);font-weight:600;padding-right:.875rem}
.split-sum{margin-top:.75rem;padding:.625rem .75rem;border-radius:var(--r-sm);background:var(--surface-2);font-size:.875rem}
.split-sum.bad{background:color-mix(in srgb,var(--st-bad) 14%,var(--surface));color:color-mix(in srgb,var(--st-bad) 80%,var(--ink))}
table.data.cmp th{white-space:normal;vertical-align:bottom;line-height:1.2}
table.data.cmp tr.low td{font-weight:600;border-bottom:0}
table.data.cmp tr.low td:first-child{font-family:inherit}
table.data.cmp td:first-child{font-family:inherit}
.tip{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc,var(--primary));border-radius:var(--r-md);padding:.875rem 1rem;margin-bottom:.75rem}
.tip.bad{--tc:var(--st-bad)}.tip.warn{--tc:var(--st-warn)}.tip.info{--tc:var(--primary)}.tip.good{--tc:var(--st-good)}
.tip-top{display:flex;align-items:flex-start;gap:.75rem}
.tip-top h3{flex:1;min-width:0;padding-top:.3125rem}
.tip-ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--tc,var(--primary)) 14%,var(--surface));color:color-mix(in srgb,var(--tc,var(--primary)) 80%,var(--ink));flex:none}
.tip-ico svg{width:18px;height:18px}
.tip h3{margin:0;font-size:1rem;font-weight:600;line-height:1.35}
.tip p{margin:.5rem 0 0;font-size:.9375rem;line-height:1.5;color:var(--ink)}
.tip-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.tips-group{font-size:.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:1.25rem .25rem .5rem}
.tip-counts{display:flex;flex-wrap:wrap;gap:.5rem}
.tip-count{display:inline-flex;align-items:baseline;gap:.25rem;padding:.25rem .625rem;border-radius:8px;font-size:.8125rem;background:color-mix(in srgb,var(--tc) 12%,var(--surface));color:color-mix(in srgb,var(--tc) 80%,var(--ink))}
.tip-count b{font-family:var(--font-num)}
.tip-count.bad{--tc:var(--st-bad)}.tip-count.warn{--tc:var(--st-warn)}.tip-count.info{--tc:var(--primary)}.tip-count.good{--tc:var(--st-good)}
.tip-row .item-title{white-space:normal;line-height:1.3}
.tip-row .tip-ico.bad{--tc:var(--st-bad)}.tip-row .tip-ico.warn{--tc:var(--st-warn)}.tip-row .tip-ico.info{--tc:var(--primary)}
.tip-row .chev{width:20px;color:var(--muted);flex:none}
.insight{display:flex;gap:.625rem;align-items:flex-start;padding:.625rem .75rem;border-radius:var(--r-sm);background:var(--surface-2);font-size:.875rem;margin-top:.5rem}
.insight svg{width:18px;height:18px;margin-top:2px;color:var(--primary-text)}

/* ---------- Hojas (modales inferiores) ---------- */
.layer{position:fixed;inset:0;z-index:70;pointer-events:none}
.layer:empty{display:none}
.backdrop{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s var(--ease);pointer-events:auto}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:94dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--glass-border);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .26s var(--ease);pointer-events:auto;padding-bottom:var(--safe-b);box-shadow:0 -8px 30px rgba(2,6,23,.2)}
.sheet.open{transform:none}
.sheet.tall{height:94dvh}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:.5rem auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem .375rem 1rem;flex:none}
.sheet-h h3{flex:1;margin:0;font-size:1.25rem;font-weight:700}
.sheet-b{overflow-y:auto;padding:.375rem 1rem 1.25rem;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sheet-f{padding:.75rem 1rem;border-top:1px solid var(--line);display:flex;gap:.625rem;flex:none}
.sheet-f .btn{flex:1}
.toasts{position:fixed;left:0;right:0;bottom:calc(96px + var(--safe-b));z-index:90;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;padding:0 1rem}
.toast{pointer-events:auto;max-width:568px;width:100%;background:var(--ink);color:var(--bg);border-radius:15px;padding:.75rem 1rem;display:flex;gap:.75rem;align-items:center;font-weight:500;box-shadow:0 10px 30px rgba(2,6,23,.3);animation:tin .22s var(--ease)}
.toast.warn{background:#92400E;color:#fff}
.toast.error{background:#B91C1C;color:#fff}
.toast.ok{background:#065F46;color:#fff}
.toast span{flex:1}
.toast button{border:0;background:rgba(255,255,255,.18);color:inherit;font-weight:700;border-radius:10px;min-height:40px;padding:0 .75rem}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Asistente de primer uso ---------- */
.wizard{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
.wz{position:relative;max-width:600px;margin:0 auto;padding:calc(var(--safe-t) + 1rem) 1rem calc(var(--safe-b) + 7rem)}
.wz-top{display:flex;justify-content:space-between;align-items:center;min-height:var(--tap)}
.wz-steps{display:flex;gap:5px;margin:.5rem 0 1.5rem}
.wz-steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.wz-steps i.on{background:var(--primary)}
.wz h1{font-size:2.125rem;font-weight:700;line-height:1.1;margin:.25rem 0 .625rem;letter-spacing:-.03em}
.wz .lead{color:var(--muted);margin:0 0 1.25rem;font-size:1.0625rem}
.wz-foot{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);padding:.75rem 1rem calc(var(--safe-b) + .75rem);border-top:1px solid var(--line)}
.wz-foot>div{max-width:600px;margin:0 auto;display:flex;gap:.625rem}
.wz-foot .btn{flex:1}
.wz-card{border-radius:var(--r-lg);padding:.875rem;margin-bottom:.625rem}
.welcome-mark{width:72px;height:72px;border-radius:22px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin:1.5rem 0 1rem}
.welcome-mark svg{width:38px;height:38px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (min-width:640px){.view{padding-top:.75rem}.kpis{grid-template-columns:repeat(4,1fr)}}
</style>

<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-title"><small id="tb-sub"></small><strong id="tb-title">Mis Finanzas</strong></div>
    <button id="tb-bell" class="icon-btn" data-act="openAlerts" aria-label="Avisos"></button>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <button id="fab" class="fab" data-act="quickAdd" aria-label="Registrar gasto rápido"></button>
  <nav class="tabbar" aria-label="Secciones"><div class="tabbar-inner" id="tabbar" role="tablist"></div></nav>
</div>
<div id="layer" class="layer"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="wizard" class="wizard" hidden></div>
<script>
'use strict';
/* =========================================================================
 * MIS FINANZAS — app de finanzas personales (HTML + CSS + JS puro)
 * Todo se guarda en este dispositivo (localStorage). No hay servidor.
 *
 * Índice del código:
 *   1. CONFIG ............ configuración central y valores por defecto
 *   2. Utilidades ........ fechas, dinero, texto
 *   3. Estado ............ cargar, guardar, migrar, festivos
 *   4. Frecuencias ....... motor de fechas recurrentes
 *   5. Cálculos .......... ocurrencias, saldos, periodos, presupuestos,
 *                          tarjetas, metas, ahorro, proyección
 *   6. Interfaz base ..... hojas, avisos, componentes
 *   7. Vistas ............ Inicio, Movimientos, Metas, Proyección, Ajustes
 *   8. Formularios ....... movimientos, cuentas, categorías, metas...
 *   9. Asistente ......... primer uso paso a paso
 *  10. Recordatorios, respaldo y arranque
 * ========================================================================= */

/* =========================================================================
 * 1. CONFIG — edita aquí los valores por defecto.
 * Lo que el usuario cambie en Ajustes se guarda encima de estos valores,
 * así que modificar este objeto solo afecta a instalaciones nuevas o a
 * opciones que el usuario nunca ha tocado.
 * ========================================================================= */
const CONFIG = {
  app: {
    name: 'Mis Finanzas',
    version: '1.5.0',
    storageKey: 'misFinanzas.v1',   // clave en localStorage
    schema: 1,                      // versión del formato de datos
  },

  /* Valores por defecto de Ajustes */
  defaults: {
    profile: { name: '' },
    format: {
      currencyCode: 'MXN',
      symbol: '$',
      symbolPosition: 'before',     // 'before' = $100 · 'after' = 100 €
      decimalSep: '.',
      thousandsSep: ',',
      decimals: 2,
      dateFormat: 'DD/MM/AAAA',     // 'DD/MM/AAAA' | 'MM/DD/AAAA' | 'AAAA-MM-DD' | 'D mmm AAAA'
      weekStart: 1,                 // 0 = domingo, 1 = lunes
    },
    period: {
      mode: 'month',                // 'month' = mes calendario · 'payday' = de un cobro al siguiente
      incomeRuleId: null,           // ingreso que marca el día de cobro (si es null se usa el principal)
    },
    savings: {
      type: 'percent',              // 'fixed' = monto fijo por periodo · 'percent' = % de cada ingreso · 'leftover' = lo que sobre
      fixed: 1000,
      percent: 10,
      distribution: 'priority',     // 'priority' | 'percent' | 'manual'
      autoApply: false,             // abonar a metas automáticamente al cerrar cada periodo
      fromAccountId: null,          // cuenta de la que sale el ahorro (opcional)
    },
    schedule: {
      weekendRule: 'none',          // si cae en fin de semana/festivo: 'none' | 'before' | 'after'
      holidaysAffect: true,         // considerar festivos además de sábados y domingos
      autoHolidaysMX: true,         // agregar los festivos oficiales de México de cada año nuevo
      autoRegister: 'fixed',        // contar solos al llegar su fecha: 'all' | 'fixed' (los variables piden confirmar) | 'none'

function deepMerge(base, over) {

}

function listJoin(arr) {

/* ---------- Fechas ----------
 * Internamente todas las fechas son texto 'AAAA-MM-DD' (sin horas ni zonas
 * horarias). Los cálculos se hacen en UTC para evitar saltos por horario de verano. */
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIA_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIA_L = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
const NTH = { 1: 'primer', 2: 'segundo', 3: 'tercer', 4: 'cuarto', '-1': 'último' };

const D = {
  pad: (n) => String(n).padStart(2, '0'),
  ymd(y, m, d) {
    const t = new Date(Date.UTC(y, m - 1, d));
    return t.getUTCFullYear() + '-' + D.pad(t.getUTCMonth() + 1) + '-' + D.pad(t.getUTCDate());
  },
  today() { const n = new Date(); return D.ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); },
  p(iso) { return { y: +iso.slice(0, 4), m: +iso.slice(5, 7), d: +iso.slice(8, 10) }; },
  t(iso) { const { y, m, d } = D.p(iso); return Date.UTC(y, m - 1, d); },
  add(iso, n) { const { y, m, d } = D.p(iso); return D.ymd(y, m, d + n); },
  diff(a, b) { return Math.round((D.t(b) - D.t(a)) / 864e5); },  // b − a, en días
  dow(iso) { return new Date(D.t(iso)).getUTCDay(); },
  dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  /** Día d del mes m; si no existe (29, 30, 31) usa el último día del mes. Acepta m fuera de 1..12. */
  clamp(y, m, d) {
    const t = new Date(Date.UTC(y, m - 1, 1)); const yy = t.getUTCFullYear(); const mm = t.getUTCMonth() + 1;
    return D.ymd(yy, mm, Math.min(Math.max(1, d), D.dim(yy, mm)));
  },
  som(iso) { const { y, m } = D.p(iso); return D.ymd(y, m, 1); },
  eom(iso) { const { y, m } = D.p(iso); return D.ymd(y, m, D.dim(y, m)); },
  addMonths(iso, n) { const { y, m, d } = D.p(iso); return D.clamp(y, m + n, d); },
  /** n-ésimo día de la semana wd del mes (nth = 1..4 o −1 para el último) */
  nth(y, m, nth, wd) {
    if (+nth === -1) { const last = D.ymd(y, m, D.dim(y, m)); return D.add(last, -((D.dow(last) - wd + 7) % 7)); }
    const day = 1 + ((wd - D.dow(D.ymd(y, m, 1)) + 7) % 7) + (nth - 1) * 7;
    return day <= D.dim(y, m) ? D.ymd(y, m, day) : null;
  },
  /** inicio de la semana según el ajuste "primer día de la semana" */
  sow(iso) { const ws = S ? S.settings.format.weekStart : 1; return D.add(iso, -((D.dow(iso) - ws + 7) % 7)); },
  months(a, b) { const A = D.p(a), B = D.p(b); return (B.y - A.y) * 12 + (B.m - A.m); },
  valid(iso) { return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso); },
  min(a, b) { return a < b ? a : b; },
  max(a, b) { return a > b ? a : b; },
};

/** Formatea una fecha. Estilos: 'full' (formato del usuario), 'short' (día y mes),
 *  'day' (con día de la semana), 'long' (texto completo), 'month' (mes y año) */
function fmtDate(iso, style = 'short') {
  if (!D.valid(iso)) return '';
  const { y, m, d } = D.p(iso); const f = S.settings.format.dateFormat; const pad = D.pad;
  const cy = D.p(D.today()).y; const yr = y !== cy;
  switch (style) {
    case 'full':
      if (f === 'MM/DD/AAAA') return `${pad(m)}/${pad(d)}/${y}`;
      if (f === 'AAAA-MM-DD') return iso;
      if (f === 'D mmm AAAA') return `${d} ${MES_C[m - 1]} ${y}`;
      return `${pad(d)}/${pad(m)}/${y}`;
    case 'short':
      if (f === 'D mmm AAAA') return `${d} ${MES_C[m - 1]}${yr ? ' ' + y : ''}`;
      if (f === 'MM/DD/AAAA') return `${pad(m)}/${pad(d)}${yr ? '/' + String(y).slice(2) : ''}`;
      if (f === 'AAAA-MM-DD') return (yr ? y + '-' : '') + `${pad(m)}-${pad(d)}`;
      return `${pad(d)}/${pad(m)}${yr ? '/' + String(y).slice(2) : ''}`;
    case 'day': return `${DIA_C[D.dow(iso)]} ${fmtDate(iso, 'short')}`;
    case 'long': return `${DIA[D.dow(iso)]} ${d} de ${MES[m - 1]}${yr ? ' de ' + y : ''}`;
    case 'month': return `${MES[m - 1]} ${y}`;
    case 'mshort': return `${MES_C[m - 1]} ${String(y).slice(2)}`;
    default: return iso;
  }
}
/** "Hoy", "Mañana", "Ayer" o la fecha con día */
function relDay(iso) {
  const n = D.diff(D.today(), iso);
  if (n === 0) return 'Hoy';
  if (n === 1) return 'Mañana';
  if (n === -1) return 'Ayer';
  return fmtDate(iso, 'day');
}
function daysText(n) { return n === 1 ? '1 día' : n + ' días'; }

/* ---------- Dinero ---------- */
function money(n, opt = {}) {
  const f = S.settings.format;
  n = Number(n); if (!isFinite(n)) n = 0;
  const neg = n < -0.004; let a = Math.abs(n); let dec = opt.decimals != null ? opt.decimals : f.decimals; let suf = '';
  if (opt.compact) {
    if (a >= 1e6) { a /= 1e6; suf = ' M'; dec = a >= 100 ? 0 : 1; }
    else if (a >= 1e4) { a /= 1e3; suf = ' k'; dec = a >= 100 ? 0 : 1; }
    else dec = 0;
  }
  let [i, dp] = a.toFixed(dec).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, f.thousandsSep);
  if (opt.compact && dp && /^0+$/.test(dp)) dp = '';
  let s = dp ? i + f.decimalSep + dp : i;
  s = f.symbolPosition === 'after' ? s + suf + ' ' + f.symbol : f.symbol + s + suf;
  return (neg ? '−' : (opt.sign && n > 0.004 ? '+' : '')) + s;
}
/** Convierte lo que escribe el usuario en número, respetando su separador decimal */
function parseAmount(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim(); if (!s) return NaN;
  const dec = S.settings.format.decimalSep;
  s = s.replace(/[^\d.,\-]/g, '');
  if (dec === ',') s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? NaN : round2(n);
}
/** Valor para mostrar dentro de un campo de monto (sin separador de miles) */
function amountField(n) {
  if (n == null || n === '' || isNaN(n)) return '';
  return String(round2(n)).replace('.', S.settings.format.decimalSep);
}

function migrate(s) {
  const base = newState();

  // tarjetas de Inicio nuevas que no existan en datos viejos

  CONFIG.defaults.home.cards.forEach((c, i) => { if (!ids.has(c.id)) out.settings.home.cards.splice(Math.min(i, out.settings.home.cards.length), 0, clone(c)); });
  out.settings.home.cards = out.settings.home.cards.filter((c) => CONFIG.homeCards[c.id]);
  for (const k of ['accounts', 'categories', 'rules', 'goals', 'holidays', 'scenarios']) if (!Array.isArray(out[k])) out[k] = [];
  out.meta = Object.assign(newState().meta, s.meta || {});
  out.sim = Object.assign(newState().sim, isObj(s.sim) ? s.sim : {});
  for (const k of ['debts', 'extras']) if (!Array.isArray(out.sim[k])) out.sim[k] = [];
  if (!isObj(out.sim.cardPlan)) out.sim.cardPlan = {};
  if (!isObj(out.sim.split)) out.sim.split = {};
  if (!isObj(out.meta.tipsHidden)) out.meta.tipsHidden = {};
  for (const r of out.rules) { r.exc = r.exc || {}; r.pauses = r.pauses || []; r.freq = normFreq(r.freq); r.created = r.created || out.startDate; }
  for (const g of out.goals) { g.history = g.history || []; }

  for (const c of out.categories) c.icon = toGlyph(c.icon, c.kind === 'income' ? 'coins' : 'tag');

  out.schema = CONFIG.app.schema;

/* ---------- Días festivos de México ----------
 * Ley Federal del Trabajo, art. 74: 1 ene, primer lunes de febrero, tercer lunes de
 * marzo, 1 may, 16 sep, tercer lunes de noviembre, 25 dic y 1 oct cada seis años
 * (transmisión del Poder Ejecutivo: 2024, 2030...). Los días inhábiles bancarios
 * (Jueves y Viernes Santo, 2 nov, 12 dic) se pueden agregar desde Ajustes. */
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return D.ymd(y, month, day);
}
function mxHolidays(y, bank = false) {
  const L = [
    [D.ymd(y, 1, 1), 'Año Nuevo'],
    [D.nth(y, 2, 1, 1), 'Día de la Constitución'],
    [D.nth(y, 3, 3, 1), 'Natalicio de Benito Juárez'],
    [D.ymd(y, 5, 1), 'Día del Trabajo'],
    [D.ymd(y, 9, 16), 'Día de la Independencia'],
    [D.nth(y, 11, 3, 1), 'Día de la Revolución'],
    [D.ymd(y, 12, 25), 'Navidad'],
  ];
  if (y >= 2024 && (y - 2024) % 6 === 0) L.push([D.ymd(y, 10, 1), 'Transmisión del Poder Ejecutivo']);
  if (bank) {
    const e = easterSunday(y);
    L.push([D.add(e, -3), 'Jueves Santo (bancos)'], [D.add(e, -2), 'Viernes Santo (bancos)'],
      [D.ymd(y, 11, 2), 'Día de Muertos (bancos)'], [D.ymd(y, 12, 12), 'Día de la Virgen de Guadalupe (bancos)']);
  }
  return L.map(([date, name]) => ({ date, name }));
}
function addHolidays(list) {
  const have = new Set(S.holidays.map((h) => h.date));
  for (const h of list) if (!have.has(h.date)) { S.holidays.push(h); have.add(h.date); }
  S.holidays.sort((a, b) => a.date.localeCompare(b.date));

    const fc = simulateTo(D.add(t, 60));
    if (fc.firstNeg) add({ id: 'neg', level: 'bad', icon: 'alert', title: `Tu dinero no alcanza el ${fmtDate(fc.firstNeg, 'long')}`,
      text: `Con tus pagos programados llegarías a ${m0(fc.low.value)} el ${fmtDate(fc.low.date, 'long')}. Mueve o reduce un gasto antes de esa fecha, pasa dinero de tu ahorro o baja el ahorro de este periodo.`,
      act: 'gotoSim', arg: fc.low.date, actLabel: 'Revisar en el simulador', weight: -fc.low.value });

    // Tarjetas: pagos vencidos, uso de la línea y pagos que se pueden dividir
    for (const a of cards) {
      const c = cardInfo(a);
      if (c.overdue) add({ id: 'over-' + a.id, level: 'bad', icon: 'card', title: `Pago vencido de ${a.name}`,
        text: `Debes ${m0(c.pendingLast)} desde el ${fmtDate(c.dueLast, 'long')}. Págalo cuanto antes: después de la fecha límite se cobran intereses y comisión, y puede afectar tu historial de crédito.`,
        act: 'openAccount', arg: a.id, actLabel: 'Ver tarjeta', weight: c.pendingLast });
      if (c.limit > 0 && c.used > T.cardUse) {
        const need = round2(c.debt - (c.limit * T.cardUse) / 100);
        add({ id: 'use-' + a.id, level: c.used > 60 ? 'warn' : 'info', icon: 'card', title: `Usas el ${Math.round(c.used)}% de tu línea en ${a.name}`,
          text: `Lo recomendable es quedarte debajo del ${T.cardUse}%: cuida tu historial de crédito y te deja margen para emergencias. Para llegar ahí tendrías que bajar tu saldo unos ${m0(need)}.`,
          act: 'openAccount', arg: a.id, actLabel: 'Ver tarjeta', weight: need });
      }
      // ¿el pago del corte actual o del siguiente cae después de dos o más cobros?
      const cand = [];
      if (c.pendingLast > 0 && c.dueLast >= t) cand.push({ pend: true, amt: c.pendingLast, from: t, due: c.dueLast });
      if (c.nextStatement > 0) cand.push({ pend: false, amt: c.nextStatement, from: c.nextCut, due: c.dueNext });
      const sp = cand.map((x) => Object.assign(x, { n: paydayDates(t, x.due).filter((d) => d >= x.from).length })).find((x) => x.n >= 2);
      if (sp && (S.sim.cardPlan[a.id] || 'due') !== 'split') add({ id: 'split-' + a.id, level: 'info', icon: 'calRange', title: `Puedes dividir el pago de ${a.name}`,
        text: `${sp.pend ? `Tu pago de ${m0(sp.amt)}` : `El pago de tu próximo corte (unos ${m0(sp.amt)})`} vence el ${fmtDate(sp.due, 'long')} y antes cobras ${sp.n} veces. En lugar de pagarlo de golpe, aparta unos ${m0(sp.amt / sp.n)} en cada cobro.`,
        act: 'gotoSim', arg: '', actLabel: 'Probar en el simulador', weight: sp.amt / 10 });
    }

    // Deuda alta en tarjetas frente al ingreso
    if (tt.debt > 0 && inc > 0 && tt.debt > inc * 0.5) add({ id: 'debt', level: tt.debt > inc ? 'warn' : 'info', icon: 'card',
      title: tt.debt > inc ? 'Tu deuda en tarjetas es mayor que tu ingreso del mes' : 'Tu deuda en tarjetas es más de la mitad de tu ingreso',
      text: `Debes ${m0(tt.debt)} y ganas unos ${m0(inc)} al mes. Antes de ahorrar para metas que no son urgentes, conviene liquidarla: el interés de una tarjeta suele ser mucho más alto que lo que gana cualquier ahorro. Paga el total de cada corte para no generar intereses.`,
      act: 'gotoAccounts', actLabel: 'Ver mis tarjetas', weight: tt.debt });

    // ¿Cuánto te queda de lo que ganas?
    const sv = S.settings.savings;
    if (inc > 0) {
      const rate = ((inc - exp) / inc) * 100; const [r1, r2] = T.savingsRate;
      const cc = categoryCompare(p).slice(0, 2).map((r) => r.cat.name);
      if (rate < 0) add({ id: 'rate', level: 'bad', icon: 'trendDown', title: 'Gastas más de lo que ganas',
        text: `En promedio salen ${m0(exp - inc)} más de lo que entra cada mes (${k.basis}).${cc.length ? ` Empieza por revisar lo que más pesa: ${listJoin(cc)}.` : ''}`,
        act: 'gotoPj', arg: 'charts', actLabel: 'Ver mis gráficas', weight: exp - inc });
      else if (rate < r1) add({ id: 'rate', level: 'warn', icon: 'piggy', title: `Solo te queda el ${Math.round(rate)}% de lo que ganas`,
        text: `Intenta llegar al ${r1}% y después al ${r2}%. Para el ${r1}% tendrías que liberar unos ${m0((inc * r1) / 100 - (inc - exp))} al mes (${k.basis}).`,
        act: 'gotoPj', arg: 'charts', actLabel: 'Ver en qué se va', weight: (inc * r1) / 100 - (inc - exp) });
      else if (rate < r2) add({ id: 'rate', level: 'info', icon: 'piggy', title: `Te queda el ${Math.round(rate)}% de lo que ganas`,
        text: `Vas bien. El siguiente paso es el ${r2}%: unos ${m0((inc * r2) / 100 - (inc - exp))} más al mes.`, weight: 1 });
      else add({ id: 'rate', level: 'good', icon: 'okCircle', title: `Te queda el ${Math.round(rate)}% de lo que ganas`,
        text: `Estás arriba de la meta común del ${r2}%. Asegúrate de que ese dinero llegue a tus metas y no se quede en la cuenta de gastos.` });
      // ahorrar primero, no lo que sobre
      if (sv.type === 'leftover' && rate >= 5) {
        const pct = Math.max(5, Math.floor((rate * 0.75) / 5) * 5);
        add({ id: 'payfirst', level: 'info', icon: 'save', title: 'Aparta tu ahorro en cuanto cobres',
          text: `Tu regla es ahorrar lo que sobre al final, y eso casi siempre termina en menos. Con lo que te queda hoy podrías apartar el ${pct}% de cada ingreso desde el día de cobro.`,
          act: 'openSection', arg: 'savings', actLabel: 'Cambiar mi regla', weight: 2 });
      }
      if ((sv.type === 'fixed' && !(+sv.fixed > 0)) || (sv.type === 'percent' && !(+sv.percent > 0))) add({ id: 'norule', level: 'info', icon: 'piggy', title: 'Define cuánto ahorrar cada periodo',
        text: 'Tu regla de ahorro está en cero. Aunque sea poco, un monto fijo o un porcentaje de cada ingreso hace que el ahorro pase sin pensarlo.',
        act: 'openSection', arg: 'savings', actLabel: 'Poner mi regla', weight: 3 });

      // Gastos fijos
      const fr = (k.fixed / inc) * 100;
      if (fr > T.fixedMax) {
        const top = recurringMonthly().filter((x) => !x.rule.variable).slice(0, 3);
        add({ id: 'fixed', level: fr > 70 ? 'warn' : 'info', icon: 'home', title: `Tus gastos fijos se llevan el ${Math.round(fr)}% de tu ingreso`,
          text: `Arriba del ${T.fixedMax}% queda poco margen para imprevistos.${top.length ? ` Los más grandes: ${listJoin(top.map((x) => `${x.rule.name} (${m0(x.monthly)} al mes)`))}.` : ''} Renegociar o cambiar alguno libera dinero todos los meses.`,
          act: 'gotoRules', actLabel: 'Ver mis recurrentes', weight: k.fixed - (inc * T.fixedMax) / 100 });
      }
    }

    // Fondo de emergencia
    if (exp > 0) {
      const months = tt.saved / exp; const [lo, hi] = T.emergencyMonths;
      const eg = activeGoals().find((g) => /emergenc|imprevist|colch/i.test(g.name));
      if (months < lo) add({ id: 'emerg', level: months < 1 ? 'warn' : 'info', icon: 'shield', title: months < 1 ? 'Arma un fondo de emergencia' : 'Sigue con tu fondo de emergencia',
        text: `Sin contar lo que tienes en efectivo y débito, tu ahorro cubre ${monthsText(months)} de gastos. Lo recomendable es de ${lo} a ${hi} meses: entre ${m0(exp * lo)} y ${m0(exp * hi)}. ${months < 1 ? `Empieza por juntar un mes: ${m0(exp)}.` : `Te faltan ${m0(exp * lo - tt.saved)} para llegar a ${lo} meses.`}`,
        act: eg ? 'contribute' : 'newEmergencyGoal', arg: eg ? eg.id : String(Math.round(exp * lo)), actLabel: eg ? `Abonar a "${eg.name}"` : 'Crear la meta', weight: exp * lo - tt.saved });
      else add({ id: 'emerg', level: 'good', icon: 'shield', title: `Tu ahorro cubre ${monthsText(months)} de gastos`,
        text: months >= hi ? `Ya pasaste los ${hi} meses recomendados. Lo que ahorres de más puede ir a otras metas o a inversiones con mejor rendimiento.` : `Está dentro de lo recomendado (${lo} a ${hi} meses).` });
    }

    // Dinero de más en efectivo y débito
    const idle = round2(tt.liquid - exp * 1.5);
    if (exp > 0 && idle > Math.max(1000, exp * 0.25)) {
      const sav = activeAccounts().filter((a) => a.type === 'savings' && +a.rate > 0).sort((a, b) => b.rate - a.rate)[0];
      let text = `Es lo que tienes en efectivo y débito por encima de mes y medio de gastos. `;
      if (tt.debt > idle * 0.2) text += `Lo primero sería bajar tu deuda de tarjetas (${m0(tt.debt)}).`;
      else if (sav) text += `En ${sav.name} (${sav.rate}% anual) te daría unos ${m0((idle * sav.rate) / 100)} al año.`;
      else text += 'En una cuenta de ahorro o inversión con rendimiento trabajaría para ti, o puedes adelantar tus metas.';
      add({ id: 'idle', level: 'info', icon: 'trendUp', title: `Tienes ${m0(idle)} que no necesitas para tus gastos`, text,
        act: tt.debt > idle * 0.2 ? 'gotoAccounts' : activeGoals().length ? 'distribute' : 'newGoal', actLabel: tt.debt > idle * 0.2 ? 'Ver mis tarjetas' : activeGoals().length ? 'Repartir a mis metas' : 'Crear una meta', weight: idle / 20 });
    }

    // Presupuestos y categorías que suben
    for (const b of budgetAlerts(p).filter((x) => x.level === 'over').slice(0, 3)) add({ id: 'bud-' + b.cat.id, level: 'warn', icon: b.cat.icon, title: `Te pasaste del presupuesto de ${b.cat.name}`,
      text: `Llevas ${m0(b.spent)} de ${m0(b.budget)} y faltan ${daysText(D.diff(t, p.end) + 1)} para cerrar el periodo. Intenta no gastar más en esto hasta tu siguiente cobro, o ajusta el presupuesto si se quedó corto.`,
      act: 'openCategory', arg: b.cat.id, actLabel: 'Ver categoría', weight: b.spent - b.budget });
    const cc = categoryCompare(p); let rises = 0;
    for (const r of cc) {
      if (r.avg == null || r.avg <= 0 || rises >= 2) continue;
      const now = r.spent + r.sched; const d = ((now - r.avg) / r.avg) * 100;
      if (d >= T.categoryRise && now - r.avg >= Math.max(300, inc * 0.02) && !(+r.budget > 0 && r.spent > r.budget)) {
        rises++;
        add({ id: 'rise-' + r.cat.id, level: 'info', icon: r.cat.icon, title: `Este periodo gastas más en ${r.cat.name}`,
          text: `${m0(now)} contra ${m0(r.avg)} de tu promedio (${Math.round(d)}% más). Si fue algo puntual, no pasa nada; si se repite, ponle un presupuesto.`,
          act: 'openCategory', arg: r.cat.id, actLabel: 'Ver categoría', weight: now - r.avg });
      }
    }
    if (!S.categories.some((c) => +c.budget > 0) && cc.length >= 2) add({ id: 'nobud', level: 'info', icon: 'tag', title: 'Ponle tope a tus gastos',
      text: `Tus categorías con más gasto este periodo son ${listJoin(cc.slice(0, 3).map((r) => r.cat.name))}. Con un presupuesto por periodo, la app te avisa antes de pasarte.`,
      act: 'gotoBudgets', actLabel: 'Poner presupuestos', weight: 1 });

    // Suscripciones
    const SUBS = /netflix|spotify|disney|hbo|\bmax\b|prime|youtube|apple|icloud|xbox|playstation|crunchyroll|paramount|vix|gimnasio|\bgym\b|streaming/i;
    const subs = recurringMonthly().filter((x) => catMatches(x.rule.categoryId, /suscrip|stream/i) || SUBS.test(x.rule.name));
    const subsM = sum(subs, (x) => x.monthly);
    if (subs.length >= 2 || (subs.length && inc > 0 && subsM > inc * 0.03)) add({ id: 'subs', level: 'info', icon: 'tv', title: `Pagas ${m0(subsM)} al mes en suscripciones`,
      text: `Son unos ${m0(subsM * 12)} al año entre ${listJoin(subs.slice(0, 4).map((x) => x.rule.name))}${subs.length > 4 ? ' y otras' : ''}. Revisa cuáles usaste el último mes y cancela o pausa las demás.`,
      act: 'gotoRules', actLabel: 'Ver mis recurrentes', weight: subsM });

    // Metas
    const goals = activeGoals(); let behind = 0;
    for (const g of goals) {
      const gi = goalInfo(g);
      if (gi.behind) { behind++; add({ id: 'goal-' + g.id, level: 'warn', icon: g.icon || 'target', title: `Vas atrasado en "${g.name}"`,
        text: `Llevas ${m0(gi.saved)} y a estas alturas deberías llevar ${m0(gi.expected)}.${gi.perPeriod ? ` Para llegar el ${fmtDate(g.deadline, 'long')} necesitas ${m0(gi.perPeriod)} por ${gi.unit}.` : ''}`,
        act: 'contribute', arg: g.id, actLabel: 'Abonar', weight: gi.expected - gi.saved }); }
      else if (gi.overdue) add({ id: 'goalo-' + g.id, level: 'info', icon: 'calendar', title: `La fecha de "${g.name}" ya pasó`,
        text: `Te faltan ${m0(gi.remaining)}. Ponle una fecha nueva para saber cuánto apartar en cada cobro.`, act: 'editGoal', arg: g.id, actLabel: 'Cambiar fecha', weight: 1 });
    }
    if (goals.some((g) => g.deadline && !goalInfo(g).reached) && !behind) add({ id: 'goalsok', level: 'good', icon: 'target', title: 'Tus metas van a tiempo', text: 'Con lo que llevas, vas al ritmo para llegar a tus fechas límite.' });
    if (!goals.length && inc > 0) add({ id: 'nogoal', level: 'info', icon: 'target', title: 'Ponle nombre y fecha a tu ahorro',
      text: 'Ahorrar para algo concreto (un fondo de emergencia, un viaje, un enganche) hace más fácil no gastarlo. La app te dice cuánto apartar en cada cobro.',
      act: 'newGoal', actLabel: 'Crear una meta', weight: 1 });

    // Meses apretados más adelante (después del pronóstico de 60 días)
    const lim = D.som(D.add(t, 61));
    const tight = monthlySeries().find((x) => x.future && x.m >= lim && x.net < 0);
    if (tight) {
      const mUntil = Math.max(1, D.months(D.som(t), tight.m));
      add({ id: 'tight-' + tight.m, level: 'warn', icon: 'calendar', title: `${fmtDate(tight.m, 'month').replace(/^./, (c) => c.toUpperCase())} viene apretado`,
        text: `Ese mes tus gastos programados (${m0(tight.exp)}) superan tus ingresos (${m0(tight.inc)}) por ${m0(-tight.net)}. Si apartas unos ${m0(-tight.net / mUntil)} al mes desde ahora, llegas sin problema.`,
        act: 'gotoPj', arg: 'charts', actLabel: 'Ver meses', weight: -tight.net });
    }

    // Vales de despensa
    if (tt.hasVouchers && tt.vouchers > 0) {
      const FOOD = /s[uú]per|despensa|mandado|abarrote|comida/i;
      const food = recurringMonthly().filter((x) => !isVoucher(x.rule.accountId) && (FOOD.test(x.rule.name) || catMatches(x.rule.categoryId, FOOD)));
      if (food.length) add({ id: 'vales', level: 'info', icon: 'ticket', title: 'Usa tus vales para el súper',
        text: `Tienes ${m0(tt.vouchers)} en vales y pagas ${listJoin(food.slice(0, 2).map((x) => x.rule.name))} con otra cuenta. Si lo pagas con vales, dejas hasta ${m0(Math.min(tt.vouchers, sum(food, (x) => x.monthly)))} libres en tu débito.`,
        act: 'openRule', arg: food[0].rule.id, actLabel: `Cambiar "${food[0].rule.name}"`, weight: Math.min(tt.vouchers, food[0].monthly) });
    }

    // Gastos pequeños de los últimos 30 días
    const small = allOccurrences(D.add(t, -30), t).filter((o) => o.kind === 'expense' && o.status === 'done' && o.amount > 0 && o.amount <= T.smallExpense && !isVoucher(o.accountId));
    const smallSum = sum(small, (o) => o.amount);
    if (small.length >= 8 && smallSum >= Math.max(500, inc * 0.03)) add({ id: 'small', level: 'info', icon: 'coffee', title: `Gastos pequeños: ${m0(smallSum)} en 30 días`,
      text: `Fueron ${small.length} gastos de ${m0(T.smallExpense)} o menos. Por separado no se notan, pero a este ritmo son unos ${m0(smallSum * 12)} al año. Ponles un tope por semana.`, weight: smallSum });

    // Ingresos variables
    const vr = S.rules.filter((r) => r.kind === 'income' && r.variable && !ruleIsPaused(r) && r.min != null && r.max != null);
    if (vr.length && S.settings.projection.variableMode !== 'min') add({ id: 'varinc', level: 'info', icon: 'scale', title: 'Planea con tu ingreso mínimo',
      text: `${listJoin(vr.map((r) => r.name))} ${vr.length > 1 ? 'cambian' : 'cambia'} cada vez. Si haces tus cuentas con el mínimo, los meses buenos se vuelven ahorro extra en lugar de gasto.`,
      act: 'setVarMode', arg: 'min', actLabel: 'Usar el mínimo', weight: 1 });

    // Lo que vas haciendo bien
    if (cards.length && !cards.some((a) => cardInfo(a).overdue) && !cards.some((a) => cardInfo(a).limit > 0 && cardInfo(a).used > T.cardUse))
      add({ id: 'cardsok', level: 'good', icon: 'card', title: 'Tus tarjetas están en orden', text: `Sin pagos vencidos y usando menos del ${T.cardUse}% de tu línea.` });
    if (S.categories.some((c) => +c.budget > 0) && !budgetAlerts(p).some((b) => b.level === 'over'))
      add({ id: 'budok', level: 'good', icon: 'tag', title: 'Vas dentro de tus presupuestos', text: 'Ninguna categoría se ha pasado de su tope en este periodo.' });
    if (!fc.firstNeg && fc.low.value > 0 && exp > 0 && S.accounts.length) add({ id: 'cashok', level: 'good', icon: 'okCircle', title: 'Te alcanza los próximos 60 días',
      text: `Tu punto más bajo sería ${m0(fc.low.value)} el ${fmtDate(fc.low.date, 'long')}.` });

    const ORD = { bad: 0, warn: 1, info: 2, good: 3 };
    return out.sort((a, b) => ORD[a.level] - ORD[b.level] || b.weight - a.weight);
  });
}
/** Recomendaciones que el usuario ocultó hace menos de CONFIG.tips.hideDays días */
function hiddenTipIds() {
  const t = D.today(); const h = S.meta.tipsHidden || {};
  return new Set(Object.keys(h).filter((id) => D.valid(h[id]) && D.diff(h[id], t) < CONFIG.tips.hideDays));
}

/* ---------- Editor de frecuencia (con vista previa de las próximas 5 fechas) ---------- */
function freqEditor(host, initial, onChange) {

  const types = [['once', 'Una sola vez'], ['days', 'Cada cierto número de días'], ['weeks', 'Semanal o cada N semanas'], ['semimonthly', 'Quincenal'], ['monthly', 'Mensual'], ['monthdays', 'Varios días del mes'], ['months', 'Cada N meses (bimestral, trimestral…)'], ['yearly', 'Anual']];
  const adjustNames = { none: 'dejar igual', before: 'adelantar al día hábil anterior', after: 'mover al siguiente día hábil' };
  function setType(t) {
    const sp = D.p(f.start);

    if (t === 'monthdays') f.days = [sp.d];
    if (t === 'yearly') { f.month = sp.m; f.day = sp.d; }
    if (t === 'monthly' || t === 'months') { f.monthMode = 'day'; f.day = sp.d; f.weekday = D.dow(f.start); }
    if (t === 'once') f.endType = 'never';

        <span class="inline-inputs mt-s"><select class="input" data-f="nth">${[1, 2, 3, 4, -1].map((n) => opt(n, 'El ' + NTH[n], f.nth)).join('')}</select><select class="input" data-f="weekday">${sortedWeekdays([0, 1, 2, 3, 4, 5, 6]).map((w) => opt(w, DIA[w], f.weekday)).join('')}</select></span></span></label>
    </div>`;

    if (t === 'days') h += `<div class="field"><span>Repetir</span><div class="inline-inputs">Cada <input class="input num" data-f="interval" inputmode="numeric" value="${f.interval}"> días</div></div>` + startField('A partir de');

      h += `<div class="field"><span>Días de la semana</span><div class="chips">${sortedWeekdays([0, 1, 2, 3, 4, 5, 6]).map((w) => `<button type="button" class="chip sq" data-wd="${w}" aria-pressed="${f.weekdays.map(Number).includes(w)}" aria-label="${DIA[w]}">${DIA_L[w]}</button>`).join('')}</div></div>`;

        <div class="chips mt-s">${[[2, 'Bimestral'], [3, 'Trimestral'], [4, 'Cuatrimestral'], [6, 'Semestral']].map(([n, l]) => `<button type="button" class="chip sm" data-int="${n}" aria-pressed="${f.interval === n}">${l}</button>`).join('')}</div></div>`;

    h += `<div class="preview" data-preview></div>`;

    if (!list.length) { box.innerHTML = `<b>Próximas fechas</b><div class="muted small">Esta regla ya no genera fechas a partir de hoy.</div>`; return; }
    box.innerHTML = `<b>${f.type === 'once' ? 'Fecha' : 'Próximas ' + list.length + ' fechas'}</b><ol>${list.map((x) => `<li>${fmtDate(x.date, 'long')}${x.date !== x.nom ? ` <span class="moved">(se movió del ${DIA_C[D.dow(x.nom)]} ${fmtDate(x.nom)})</span>` : ''}${x.date < t ? ' <span class="muted small">(ya pasó)</span>' : ''}</li>`).join('')}</ol>`;
  }
  function draw() { host.innerHTML = html(); preview(); }
  const changed = () => { preview(); onChange && onChange(f); };
  host.addEventListener('input', (e) => {

    const wd = e.target.closest('[data-wd]'), md = e.target.closest('[data-md]'), it = e.target.closest('[data-int]'), fe = e.target.closest('[data-fe]');

/* ---------- Gráficas (SVG, sin librerías) ----------
 * Reglas (skill de visualización): líneas de 2 px, rejilla de 1 px sólida y
 * tenue, columnas de máximo ~10 px con punta redondeada, separación de 2 px,
 * leyenda siempre que haya 2 o más series, tooltip al tocar y con teclado,
 * y una tabla con los datos para no depender del color. */
const CHARTS = {};
function niceTicks(lo, hi, count = 4) {
  const span = hi - lo || 1; const raw = span / count; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const nr = raw / mag; const step = (nr <= 1 ? 1 : nr <= 2 ? 2 : nr <= 2.5 ? 2.5 : nr <= 5 ? 5 : 10) * mag;
  const out = []; for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(round2(v));
  return out;
}
function yAxis(ticks, Y, L, R, W) {
  let g = '';
  for (const tv of ticks) g += `<line class="${tv === 0 ? 'base' : 'grid'}" x1="${L}" x2="${W - R}" y1="${Y(tv).toFixed(1)}" y2="${Y(tv).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(Y(tv) + 3.5).toFixed(1)}" text-anchor="end">${esc(money(tv, { compact: true }))}</text>`;
  return g;
}
/** Línea. series: [{name, color, points:[{date, y}], dashed, fill}] · markers: [{date, y, label, color}] */
function lineChart(id, series, { markers = [], height = 220, label = 'Gráfica', xFmt = null } = {}) {
  const pts0 = series[0] && series[0].points; if (!pts0 || pts0.length < 2) return '<div class="empty small">No hay suficientes datos para la gráfica.</div>';
  const W = 340, H = height, L = 46, R = 10, T = 20, B = 24; const n = pts0.length;
  const t0 = D.t(pts0[0].date), t1 = D.t(pts0[n - 1].date);
  const X = (d) => L + ((D.t(d) - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  let lo = Infinity, hi = -Infinity;
  for (const s of series) for (const p of s.points) { lo = Math.min(lo, p.y); hi = Math.max(hi, p.y); }
  lo = Math.min(0, lo); if (hi - lo < 1) hi = lo + 1;
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = yAxis(ticks, Y, L, R, W);
  const span = D.diff(pts0[0].date, pts0[n - 1].date); const fmt = xFmt || (span > 200 ? 'mshort' : 'short');
  const nl = Math.min(4, n);
  for (let i = 0; i < nl; i++) {
    const idx = Math.round((i * (n - 1)) / Math.max(1, nl - 1)); const d = pts0[idx].date;
    g += `<text class="axis" x="${X(d).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === nl - 1 ? 'end' : 'middle'}">${esc(fmtDate(d, fmt))}</text>`;
  }
  for (const s of series) {
    const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${X(p.date).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
    if (s.fill) g += `<path d="${d} L${X(s.points[s.points.length - 1].date).toFixed(1)} ${Y(Math.max(lo, 0)).toFixed(1)} L${X(s.points[0].date).toFixed(1)} ${Y(Math.max(lo, 0)).toFixed(1)} Z" fill="${s.color}" opacity=".1"/>`;

  g += `<line class="guide" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" style="display:none"/>`;

    tip: (i) => `<div class="muted">${esc(fmtDate(pts0[i].date, 'full'))}</div>` + series.map((s) => `<div><span class="k" style="background:${s.color}"></span><b>${esc(money(s.points[i].y, { decimals: 0 }))}</b> ${esc(s.name)}</div>`).join('') };

/** Columnas agrupadas (2 series). rows: [{label, values:[a, b], faded, current, title}] */
function columnChart(id, rows, series, { height = 210, label = 'Gráfica' } = {}) {
  if (!rows.length) return '';
  const W = 340, H = height, L = 46, R = 6, T = 12, B = 24; const n = rows.length; const band = (W - L - R) / n;
  const bw = Math.max(4, Math.min(11, (band - 7) / 2));
  let hi = 1; for (const r of rows) for (const v of r.values) hi = Math.max(hi, v);
  const ticks = niceTicks(0, hi, 4); const top = ticks[ticks.length - 1];
  const Y = (v) => T + (1 - v / top) * (H - T - B); const base = Y(0);
  let g = '';
  rows.forEach((r, i) => { if (r.current) g += `<rect x="${(L + i * band).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${(H - T - B).toFixed(1)}" rx="6" fill="var(--primary-soft)"/>`; });
  g += yAxis(ticks, Y, L, R, W);
  const col = (x, v, color, faded) => {
    const y = Y(v); const h = base - y; if (h < 0.5) return '';
    const rr = Math.min(3.5, bw / 2, h);
    return `<path d="M${x.toFixed(1)} ${base.toFixed(1)} V${(y + rr).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + rr).toFixed(1)} ${y.toFixed(1)} H${(x + bw - rr).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + rr).toFixed(1)} V${base.toFixed(1)} Z" fill="${color}" ${faded ? 'opacity=".42"' : ''}/>`;
  };
  rows.forEach((r, i) => {
    const c = L + i * band + band / 2;
    g += col(c - bw - 1, r.values[0], series[0].color, r.faded) + col(c + 1, r.values[1], series[1].color, r.faded);
    g += `<text class="axis" x="${c.toFixed(1)}" y="${H - 6}" text-anchor="middle" ${r.current ? 'style="font-weight:600;fill:var(--ink)"' : ''}>${esc(r.label)}</text>`;
  });
  rows.forEach((r, i) => { g += `<rect class="hit" data-i="${i}" x="${(L + i * band).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${(H - T).toFixed(1)}" rx="6"/>`; });
  CHARTS[id] = { W, xs: rows.map((r, i) => L + i * band + band / 2), band: true,
    tip: (i) => `<div class="muted">${esc(rows[i].title || rows[i].label)}${rows[i].faded ? ' (proyectado)' : ''}</div>` + series.map((s, k) => `<div><span class="k" style="background:${s.color}"></span><b>${esc(money(rows[i].values[k], { decimals: 0 }))}</b> ${esc(s.name)}</div>`).join('') + (rows[i].extra || '') };
  return `<div class="chart" data-chart="${id}" tabindex="0" role="img" aria-label="${esc(label)}. Toca una columna o usa las flechas para ver valores."><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg><div class="chart-tip" hidden></div></div>`;
}
function attachCharts(root = document) {
  $$('.chart[data-chart]', root).forEach((el) => {
    const c = CHARTS[el.dataset.chart]; if (!c || el.dataset.bound) return; el.dataset.bound = '1';
    const svg = $('svg', el), tip = $('.chart-tip', el), guide = $('.guide', el); let cur = -1;
    const showAt = (i) => {
      cur = clampN(i, 0, c.xs.length - 1); const r = svg.getBoundingClientRect(); const gx = c.xs[cur];
      if (guide && c.guide) { guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.style.display = ''; }
      if (c.band) $$('.hit', svg).forEach((h) => h.classList.toggle('on', +h.dataset.i === cur));
      tip.hidden = false; tip.innerHTML = c.tip(cur);
      tip.style.left = clampN((gx / c.W) * r.width, 70, r.width - 70) + 'px';
    };
    const hide = () => { tip.hidden = true; if (guide) guide.style.display = 'none'; $$('.hit.on', svg).forEach((h) => h.classList.remove('on')); };
    const nearest = (ev) => { const r = svg.getBoundingClientRect(); const x = ((ev.clientX - r.left) / r.width) * c.W; let best = 0, bd = Infinity; c.xs.forEach((v, i) => { const dx = Math.abs(v - x); if (dx < bd) { bd = dx; best = i; } }); return best; };
    svg.addEventListener('pointerdown', (e) => showAt(nearest(e)));

      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); showAt(cur < 0 ? (e.key === 'ArrowRight' ? 0 : c.xs.length - 1) : cur + (e.key === 'ArrowRight' ? 1 : -1)); }

}

/* ---------- Apariencia ---------- */
function contrastText(hex) {
  const h = String(hex).replace('#', ''); if (h.length < 6) return '#fff';
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));

}
function applyAppearance() {
  const a = S.settings.appearance; const root = document.documentElement;
  if (a.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', a.theme);
  root.style.setProperty('--primary', a.primary);
  root.style.setProperty('--on-primary', contrastText(a.primary));
  root.style.fontSize = 16 * (+a.fontScale || 1) + 'px';
  requestAnimationFrame(() => { const m = $('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(root).getPropertyValue('--bg').trim() || '#EEF0EC'; });
}
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S && applyAppearance()); } catch (e) { /* navegadores viejos */ } }

const ACT = {};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.type === 'checkbox') return;     // los interruptores se manejan en "change"
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type === 'checkbox' && el.dataset.act && ACT[el.dataset.act]) { ACT[el.dataset.act](el.dataset, el, e); return; }
  if (!el.dataset || !el.dataset.set) return;
  let v = el.type === 'checkbox' ? el.checked : el.value; const t = el.dataset.type;
  if (t === 'num') v = parseFloat(String(v).replace(',', '.')) || 0;
  else if (t === 'int') v = parseInt(v, 10) || 0;
  else if (t === 'money') v = parseAmount(v) || 0;

});
function settingChanged(path, v) {
  const f = S.settings.format;
  if (path === 'format.decimalSep' && f.thousandsSep === v) f.thousandsSep = v === ',' ? '.' : ',';
  if (path === 'format.thousandsSep' && f.decimalSep === v) f.decimalSep = v === ',' ? '.' : ',';
  if (path === 'format.currencyCode') {        // al cambiar de moneda se aplican su símbolo y separadores
    const c = CONFIG.currencies.find((x) => x.code === v);
    if (c && c.code !== 'OTRA') Object.assign(f, { symbol: c.symbol, symbolPosition: c.position || 'before', decimalSep: c.decimalSep || '.', thousandsSep: c.thousandsSep != null ? c.thousandsSep : ',', decimals: c.decimals != null ? c.decimals : 2 });
  }

  if (path === 'schedule.autoHolidaysMX' && v) { S.meta.holidayYears = []; ensureHolidays(); }
}
